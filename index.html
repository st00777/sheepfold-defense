<title>羊圈守夜</title>
<style>
  /* 色票集中在這裡，之後換美術只改這一區 */
  :root {
    --bg: #2b2a26;         /* 夜色底 */
    --panel: #3a3831;      /* 面板 */
    --grass: #4f6b3a;      /* 草地格 */
    --grass2: #5a7a43;     /* 草地格（交錯色） */
    --rock: #5a5650;       /* 石頭格 */
    --line: #2e3d24;
    --text: #f3ead8;
    --muted: #b9b09c;
    --gold: #e6b84a;       /* 糧 */
    --danger: #d9534f;
    --ok: #7bc47f;
    --card: #4a4639;
    --card-on: #6e6447;
    --new: #ffd98a;
    --ease-out: cubic-bezier(.23, 1, .32, 1); /* 進退場共用：先快後慢 */
    --grass-t: #4f6b3acc; --grass2-t: #5f7f46b8; /* 草地格改半透明，底下是 img/ground.webp 的草地圖；alpha 壓到七成，敵我對比照舊 */
    /* 我方單位底色：卡片左上角的小色塊與場上色一致 */
    --u-shepherd: #3d6ea8; --u-slinger: #a8553d; --u-sling: #8a3f2e; --u-hireling: #7d7a6a; --u-archer: #6b4e2e;
    --u-wall: #777; --u-tower: #5c5c66; --u-dog: #c9a24a; --u-thorns: #4a7a3a;
    --u-brazier: #6e3a1e; --u-jar: #8a5a2e; --u-horn: #7a6a2a; --u-healer: #3d8a7a; --u-catapult: #5a4a3a;
    --u-staff: #8a6a3a; --u-lamp: #b8862a; --u-patrol: #4a5a7a; --u-volley: #a8553d; --u-cradle: #7a4a6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

  /* 上方資源列 */
  /* 核心閱讀文字至少 13px；大字模式只調字級，不放大整頁與視窗高度。 */
  html.big .card .name, html.big .card .cost, html.big .rc .name, html.big .rc .cost { font-size: 15px; }
  html.big .dialog p, html.big .tips, html.big .newbox, html.big #roster-detail { font-size: 17px; }
  html.big .dialog .ref, html.big #diff-hint, html.big #best, html.big .lv .t span, html.big #roster-detail .num { font-size: 15px; }
  html.big #toast, html.big .snd-row { font-size: 17px; }
  #top, #cards-wrap, #bottom, #dev { flex-shrink: 0; }
  #top { gap: 6px; }
  #top > span:first-child, #sheep { white-space: nowrap; }
  #top > span:last-child { display: flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; flex: 1; }
  #wave-info { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #top { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--panel); font-size: 15px; }
  #top b { font-size: 18px; }
  #food { color: var(--gold); }
  #sheep[hidden] { display: none; }
  #wave-info { color: var(--muted); }
  #pause-btn, #snd-btn, #fast-btn { font: inherit; font-size: 16px; background: var(--card); color: var(--text); border: 1px solid #0006; border-radius: 8px; padding: 6px; min-width: 36px; min-height: 36px; flex-shrink: 0; cursor: pointer; }
  /* 聲音設定（暫停層）：一列一個選項，右邊是開關或三檔 */
  .snd { text-align: left; margin: 12px 0 4px; }
  .snd-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-top: 1px solid #0004; font-size: 15px; }
  .snd-row:first-child { border-top: 0; }
  .snd-row .seg { display: flex; gap: 4px; }
  .snd-row button { font: inherit; font-size: 14px; background: var(--card); color: var(--text); border: 2px solid transparent; border-radius: 8px; padding: 5px 14px; cursor: pointer; min-width: 52px; }
  .snd-row button.on { border-color: var(--gold); background: var(--card-on); }
  .snd-row.off { opacity: .4; pointer-events: none; } /* 音效關著時，蟲鳴與音量先壓暗 */
  .snd-note { font-size: 13px; color: var(--muted); margin-top: 6px; text-align: left; }
  /* 開場頁右上角的喇叭：第一次進來就看得到，聲音響起前就能關 */
  #levels .dialog { position: relative; }
  .corner { position: absolute; right: 12px; top: 12px; font: inherit; font-size: 18px; background: var(--card); color: var(--text); border: 1px solid #0006; border-radius: 8px; padding: 3px 9px; cursor: pointer; }
  #resume-line { margin-top: 10px; }
  #resume-line[hidden] { display: none; }

  /* 卡片列：自動換行的格子，手機一排 5 張、8 張卡加鏟子剛好兩排，不用左右滑（2026-10-17 James：手機要一直滑很煩）；寬螢幕自然回到一排 */
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; padding: 8px 12px; background: var(--panel); border-top: 1px solid #000; }
  .card { background: var(--card); border: 2px solid transparent; border-radius: 10px; padding: 7px 3px 6px; text-align: center; cursor: pointer; transition: transform 120ms var(--ease-out), opacity 150ms; min-height: 60px; position: relative; }
  /* 分組只靠左上角的小色點與排序；格子會換行，不再畫分隔線 */
  /* 送卡模式：新送到的那張從下面浮上來，其他張不動 */
  .card.arrive { transition: transform 150ms var(--ease-out), opacity 150ms var(--ease-out); }
  @starting-style { .card.arrive { opacity: 0; transform: translateY(6px); } }
  .card .dot { position: absolute; left: 5px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--u, #888); }
  .card .tag { position: absolute; right: 4px; top: 3px; font-size: 10px; color: #2b2a26; background: var(--new); border-radius: 6px; padding: 0 4px; }
  #cards-wrap { background: var(--panel); }
  .card .ico { font-size: 24px; line-height: 1; }
  /* Fluent 3D 圖示（img/ico/*.webp）：包在原本的 .ico 裡，大小跟著字級走，emoji 的呼吸／走路動畫規則照用 */
  img.ei { width: 1.15em; height: 1.15em; vertical-align: -.2em; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
  .card .name { font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .cost { font-size: 13px; color: var(--gold); white-space: nowrap; }
  @media (min-width: 560px) { .card .ico { font-size: 26px; } .card .name, .card .cost { font-size: 13px; } }
  .card.selected { border-color: var(--gold); background: var(--card-on); }
  .card.poor { opacity: .45; }
  .card.shovel { background: #3f3b31; }
  .card.once, .rc.once { border-style: dashed; border-color: #f3ead855; }
  .card.once.selected, .rc.once.on { border-color: var(--gold); }
  .tag.once { background: #f3ead8cc; }
  .new .tag.once { right: 30px; }
  /* 新卡光暈：陰影固定畫在一層假元素上，循環只動它的透明度，不每幀重繪陰影 */
  .card.new::after { content: ''; position: absolute; inset: -2px; border-radius: 10px; box-shadow: 0 0 10px 2px var(--new); pointer-events: none; animation: glowFade 1.4s infinite alternate; }
  @keyframes glowFade { from { opacity: 0; } to { opacity: 1; } }
  /* 教學：沒輪到的卡壓暗（要放的格子亮金框在 render.js 畫） */
  .card.dim { opacity: .25; pointer-events: none; }
  #tut-skip { display: none; margin: 6px auto 0; font: inherit; font-size: 12px; background: transparent; color: var(--muted); border: 1px solid var(--muted); border-radius: 6px; padding: 3px 10px; }
  #tut-skip.on { display: block; }
  /* 按壓回饋：所有可按的東西都縮一點點 */
  .btn, .diff, .tab, .lv, .rc, #pause-btn, #snd-btn, .corner, .snd-row button, #tut-skip { transition: transform 120ms var(--ease-out); }
  .card:active, .btn:not(:disabled):active, .diff:active, .tab:active, .lv:not(.locked):active, .rc:not(.locked):active, #pause-btn:active, #snd-btn:active, .corner:active, .snd-row button:active, #tut-skip:active { transform: scale(.97); }

  /* 棋盤 */
  #board-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
  #stage { width: 100%; max-width: 640px; } /* 棋盤＋提示列一組，寬度由 fitBoard 依剩餘高度算 */
  #shell { position: relative; width: 100%; padding-left: var(--lane); --lane: 28px; --rows: 5; } /* --rows：棋盤有幾排高；有坡的夜多 HILL_DROP 排（高地的排整排往下沉），看門的照這個數對位 */ /* 左邊留一條「門口」走道給看門的，不跟第 0 欄搶位置 */
  #lane { position: absolute; left: 0; top: 0; bottom: 0; width: var(--lane); border-radius: 8px 0 0 8px; background: linear-gradient(90deg, #2f2c24, #3d3929); box-shadow: inset -2px 0 4px #0006; }
  /* 棋盤本體是一張 canvas（render.js 用 PixiJS 畫），這裡只留盒子；開不了 WebGL 時 #board-fail 的說明會蓋在上面 */
  #board { position: relative; width: 100%; aspect-ratio: 7 / 5; border-radius: 8px; overflow: hidden; background: #243a2a; touch-action: manipulation; }
  #board canvas { display: block; width: 100%; height: 100%; }
  #board-fail { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; text-align: center; font-size: 14px; line-height: 1.6; color: var(--muted); background: #243a2a; }
  #board-fail.on { display: flex; }
  /* 外框獨立一層：頭目登場只震這一層，棋盤格子不動，手機不會點錯格 */
  #frame { position: absolute; inset: -3px -3px -3px calc(var(--lane) - 3px); border: 3px solid var(--line); border-radius: 10px; pointer-events: none; z-index: 6; }

  #shell.dawn .gate span { filter: drop-shadow(0 0 6px #ffd98a); }
  /* 看門的：每排門口左下角一個小人影，用掉就淡出往左退（站在棋盤外的走道上，維持 DOM） */
  .gate { position: absolute; left: 0; width: var(--lane); height: calc(100% / var(--rows, 5)); display: flex; align-items: center; justify-content: center; cursor: pointer; } /* 一排一位；點他看說明 */
  .gate span { font-size: clamp(20px, 5.6vw, 30px); line-height: 1; filter: drop-shadow(0 0 2px #000) drop-shadow(0 2px 2px #000a); transition: opacity 250ms var(--ease-out), transform 250ms var(--ease-out); }
  .gate.flash::before { content: ''; position: absolute; inset: 2px 0; border-radius: 6px; background: var(--danger); animation: gateFlash 1.1s ease-out forwards; pointer-events: none; } /* 用掉那一刻門口閃紅：讓新手看見「這排少了一條命」 */
  @keyframes gateFlash { from { opacity: .75; } to { opacity: 0; } }
  .gate.none { display: none; } /* 這個難度本來就沒有的排：不畫（跟「用掉了」的灰影分開） */
  .gate.used span { opacity: .38; transform: scale(.85); filter: grayscale(1) drop-shadow(0 0 2px #000); } /* 用掉的留灰影：分得出「用掉了」和「本來沒有」 */
  .card.capped { opacity: .45; }

  /* 開發者模式列 */
  #dev { display: none; flex-wrap: wrap; gap: 6px; padding: 6px 12px; background: #1f1e1a; border-top: 1px solid #000; font-size: 12px; align-items: center; }
  #dev.on { display: flex; }
  #dev button, #dev select { font: inherit; font-size: 12px; background: var(--card); color: var(--text); border: 1px solid #0006; border-radius: 6px; padding: 4px 8px; }
  #dev button.on, #fast-btn.on { background: var(--gold); color: #2b2a26; }
  #dev .lab { color: var(--muted); }

  /* 底部進度條 */
  #bottom { margin-top: 10px; padding: 8px 12px 12px; background: var(--panel); border-radius: 10px; }
  #bar { height: 8px; background: #0006; border-radius: 4px; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 100%; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease-out); }
  #toast { text-align: center; font-size: 15px; color: var(--muted); min-height: 20px; margin-top: 6px; }
  #toast.tip { color: var(--new); }

  /* 蓋在上面的對話／結果畫面 */
  .overlay { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; overflow-y: auto; }
  .overlay[hidden] { display: none; }
  /* 對話框進場：先小一點點再浮出；暫停是系統反應，不給動畫 */
  .dialog { transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
  @starting-style { .overlay:not([hidden]) .dialog { opacity: 0; transform: scale(.97); } }
  #pause .dialog { transition: none; }
  .dialog { background: var(--panel); border-radius: 14px; padding: 22px 20px; max-width: 420px; width: 100%; text-align: center; margin: auto; }
  #intro .dialog { display: flex; flex-direction: column; max-height: calc(100dvh - 40px); padding: 0; overflow: hidden; }
  .intro-content { min-height: 0; overflow-y: auto; padding: 20px 20px 12px; }
  .intro-actions { flex-shrink: 0; padding: 0 16px 14px; background: var(--panel); border-top: 1px solid #ffffff20; }
  .intro-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .intro-buttons .btn { width: 100%; margin: 0; padding: 10px 8px; }
  #start, #resume-cp { grid-column: 1 / -1; }
  #best:empty, #intro-tips:empty { display: none; }
  @media (max-height: 540px) { .overlay { padding: 8px; } #intro .dialog { max-height: calc(100dvh - 16px); } .intro-actions { padding-bottom: 8px; } .intro-buttons { grid-template-columns: repeat(3, 1fr); } #start { grid-column: auto; } #diffs { margin-top: 6px; } }
  .dialog h1 { margin: 0 0 6px; font-size: 24px; }
  .dialog .ref { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .dialog p { line-height: 1.7; font-size: 15px; text-align: left; }
  .dialog .who { color: var(--gold); }
  .dialog .verse { background: #0004; border-left: 3px solid var(--gold); padding: 8px 10px; border-radius: 4px; }
  #diffs { display: flex; gap: 6px; margin: 10px 0 4px; }
  #gate-preview { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 6px 0; font-size: 13px; }
  #gate-preview span { padding: 4px 0; border-radius: 5px; background: #0003; color: var(--muted); }
  #gate-preview .protected { background: #e6b84a25; color: var(--gold); outline: 1px solid #e6b84a66; }
  .diff { flex: 1; background: var(--card); color: var(--text); border: 2px solid transparent; border-radius: 10px; padding: 9px 0; font-size: 15px; font-family: inherit; cursor: pointer; }
  .diff.selected { border-color: var(--gold); background: var(--card-on); }
  #diff-hint { font-size: 13px; color: var(--muted); min-height: 16px; margin-bottom: 8px; }
  .btn.alt { background: transparent; color: var(--muted); border: 1px solid var(--muted); margin-top: 8px; }
  .btn { display: inline-block; margin-top: 12px; padding: 12px 28px; font-size: 17px; border-radius: 10px; border: 0; background: var(--gold); color: #2b2a26; font-weight: bold; cursor: pointer; font-family: inherit; }
  .btn[hidden] { display: none; }
  .btn:disabled { opacity: .4; cursor: default; }
  .tips { font-size: 14px; color: var(--muted); text-align: left; margin-top: 10px; line-height: 1.6; }
  /* 今晚有新夥伴：先引去圖鑑看一眼再開打（只提醒一次） */
  .newbox { background: #0004; border: 1px solid var(--new); border-radius: 10px; padding: 10px 12px 12px; margin-top: 8px; font-size: 14px; line-height: 1.6; }
  .newbox[hidden] { display: none; }
  .newbox .btn { margin-top: 6px; padding: 9px 22px; font-size: 15px; }
  .btn.quiet { background: transparent; color: var(--text); border: 1px solid var(--muted); }
  .tips .new { color: var(--new); }
  #best { font-size: 13px; color: var(--muted); margin-top: 8px; white-space: pre-line; }

  /* 首頁：一次只看一章，十夜塞進一屏不用捲（2026-10-17 James：選關要往下拉、圖鑑太下面；2026-10-18 補到十夜後列高再縮一點） */
  .dialog.home { padding: 18px 16px 14px; }
  .dialog.home h1 { font-size: 22px; }
  .dialog.home .ref { margin-bottom: 8px; }
  #continue-btn { margin-top: 2px; padding: 11px 22px; font-size: 16px; }
  .btn.small { margin-top: 6px; padding: 6px 14px; font-size: 13px; }
  #ch-tabs { margin: 10px 0 4px; }
  #ch-tabs .tab { padding: 7px 0; font-size: 14px; }
  #ch-tabs .tab.locked { opacity: .4; }
  .ch-sub { font-size: 13px; min-height: 16px; }
  .lv { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 9px; padding: 5px 10px; margin-top: 4px; text-align: left; cursor: pointer; }
  .lv.locked { opacity: .45; cursor: default; }
  .lv.next { outline: 2px solid var(--gold); outline-offset: -2px; }
  .lv .n { font-size: 17px; width: 24px; text-align: center; color: var(--gold); }
  .lv .t { flex: 1; min-width: 0; }
  .lv .t b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lv .t span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .lv .s { font-size: 12px; color: var(--ok); white-space: nowrap; text-align: right; }
  .lv .s .stars { font-size: 14px; color: var(--gold); letter-spacing: 1px; line-height: 1.1; }
  .lv .s .stars.none { color: var(--muted); opacity: .6; }
  .tab.full { border-color: var(--gold); }
  /* 結算頁星級：三顆依序跳出 */
  #stars { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 4px 0 2px; }
  #stars .st { font-size: 13px; padding: 4px 9px; border-radius: 999px; background: var(--card); color: var(--muted); opacity: 0; animation: starIn 320ms var(--ease-out) forwards; animation-delay: calc(var(--i) * 180ms + 350ms); }
  #stars .st.on { color: var(--gold); background: var(--card-on); }
  #stars-note { font-size: 13px; color: var(--muted); margin: 0 0 8px; min-height: 1em; }
  @keyframes starIn { from { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.08); } to { opacity: 1; transform: scale(1); } }
  .upd { margin-top: 10px; font-size: 12px; color: var(--muted); }
  #psalm { text-align: left; font-size: 15px; line-height: 1.9; margin-top: 10px; }
  #psalm div { opacity: 0; transition: opacity 1.2s; }
  #psalm .ref { text-align: center; margin-bottom: 4px; }
  #psalm div.on { opacity: 1; }

  /* 點兵與圖鑑 */
  .dialog.roster { max-width: 460px; }
  .tabs { display: flex; gap: 6px; margin: 8px 0 10px; }
  .tab { flex: 1; background: var(--card); color: var(--text); border: 2px solid transparent; border-radius: 10px; padding: 8px 0; font-size: 15px; font-family: inherit; cursor: pointer; }

function nightfall() { Board.lose(); }
// 引擎事件對應的音效（名稱在 sound.js）；沒列的就沒聲音
const FX_SFX = { blast: 'blast', ignite: 'ignite', horn: 'horn', emerge: 'emerge', grab: 'grab', splash: 'hit', enrage: 'growl', rest: 'whine', howl: 'howl', roar: 'roar', flee: 'whine', slam: 'boar', crouch: 'growl', home: 'sheep', strike: 'hit',
  overfly: 'overfly', roll: 'roll', pit: 'pit', water: 'water', throw: 'throw' }; // 第三章：咻、滾石、陷坑、水袋、強盜丟石
const SPAWN_SFX = { owl: 'owl', leopard: 'growl', eagle: 'eagle', aurochs: 'aurochs' }; // 出生就叫的敵人：無月夜看不到，先聽到；大鷹飛高打不到，尖嘯讓人抬頭找影子
// 把引擎這一步發生的事畫出來（棋盤上的交給 render.js，這裡放音效、提示、存檔、勝負）
function flushEvents() {
  const spawned = [];
  for (const e of G.events) {
    switch (e.t) {
      case 'spawn': spawned.push(e.e.type); if (SPAWN_SFX[e.e.type]) Sound.play(SPAWN_SFX[e.e.type]); if (ENEMIES[e.e.type].boss) bossEnter(); break;
      case 'toast': toast(e.msg); break;
      case 'die': Sound.play('die'); Board.event(e, G); break;
      case 'hit': Board.event(e, G); break;
      case 'callout': if (!seenEnemy(e.type)) { toast(`${ENEMIES[e.type].ico} ${e.tip}`, true); markSeenEnemy(e.type); } break;
      case 'pop': Board.event(e, G); if (String(e.text)[0] === '+') Sound.play('food'); break;
      case 'unit': Board.event(e, G); break;
      case 'fx': Board.event(e, G); if (FX_SFX[e.kind]) Sound.play(FX_SFX[e.kind]); if (e.kind === 'gate') Sound.play('horn'); if (e.kind === 'grab' && SPAWN_SFX[e.type]) Sound.play(SPAWN_SFX[e.type]); break; // 大鷹抓羊再尖嘯一聲（提案 §5 #11）
      case 'marker': case 'strayMark': Board.event(e, G); break;
      case 'sheep': $('#sheep-n').textContent = G.sheep; break;
      case 'hand': buildCards(); if (selected && selected !== 'shovel' && !G.hand.includes(selected)) clearSelection(); break; // 送卡模式：手上的卡變了；選著的那張已經不在就取消
      case 'stray': Sound.play('sheep'); break;
      case 'waveclear': if (e.wave < G.waves.length) { Sound.play('clear'); if (!devUsed && !saveCheckpoint(Engine.snapshot(G))) toast('這次進度未能保存。請先保持遊戲開啟，離開後可能需要重來。', true); } break;
      case 'win': onWin(); break;
      case 'lose': onLose(e.reason, e.by); break;
    }
  }
  G.events.length = 0;
  for (const t of spawned) markSeenEnemy(t);
}

// ====== 每一幀 ======
function tick(now) {
  raf = requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (paused) return;
  // 加速時分成小步跑，數值行為才跟 1× 一樣
  const wasWave = G.phase === 'wave';
  try {
    for (let i = 0; i < speed; i++) { Engine.step(G, dt); flushEvents(); if (G.over) break; }
    if (!wasWave && G.phase === 'wave') { Sound.play('wave'); if (diff === 'storm' && Math.random() < .35) Board.lightning(); } // 暴風夜：波開始時偶爾閃一次電
    draw(dt);
  } catch (err) {
    // 引擎或畫面丟例外：以前 rAF 迴圈會就此停掉、畫面定格沒有任何提示（2026-10-20 P3）。現在停下這一局、說一聲、回關卡；清完的波已存，可以「繼續上次」
    console.error(err);
    cancelAnimationFrame(raf); if (G) G.over = true;
    try { localStorage.setItem('sheepfold-lasterr', `${new Date().toISOString()} ${err && err.stack || err}`.slice(0, 2000)); } catch (e) {}
    toast(`出了點狀況，這一局先停下。${checkpointNote()}（${String(err && err.message || err).slice(0, 80)}）`, true);
    setTimeout(backToLevels, 1800);
  }
}
// 速度：玩家用右上角 ⏩ 在 1× 與 2× 之間切（存 sheepfold-speed）；開發者列的 1／2／4／8× 走同一條
function setSpeed(n) {
  speed = n; Board.setSpeed(speed);
  document.querySelectorAll('#dev [data-speed]').forEach(x => x.classList.toggle('on', Number(x.dataset.speed) === speed));
  const fb = $('#fast-btn'); fb.classList.toggle('on', speed > 1); fb.textContent = speed > 1 ? `⏩${speed}×` : '⏩'; fb.title = speed > 1 ? `加速中 ${speed}×，點一下回正常` : '加速（二倍速）';
  try { localStorage.setItem('sheepfold-speed', String(speed)); } catch (e) {}
}
$('#fast-btn').addEventListener('click', () => { setSpeed(speed > 1 ? 1 : 2); Sound.play('tap'); });
try { const sp = Number(localStorage.getItem('sheepfold-speed')); if (sp === 2) setSpeed(2); } catch (e) {}

function draw(dt = 0) {
  setText($('#food'), G.level.conveyor ? '—' : String(Math.floor(G.food)));
  const t = Math.ceil(G.timer), n = G.waves.length;
  setText($('#wave-info'),
    G.holdWaves ? '照著提示做' :
    G.phase === 'prep' ? (G.started ? `第 1 波 ${t} 秒後來` : '放下第一個單位才開始倒數') :
    G.phase === 'rest' ? (G.wave >= n ? '天快亮了' : `第 ${G.wave + 1} 波 ${t} 秒後來`) :
    `第 ${G.wave} / ${n} 波`);
  // 棋盤裡的一切（單位、敵人、投射物、效果、天色）交給 render.js；它回報有沒有人在咬、這一幀新出手幾發，聲音在這裡放
  const info = Board.frame(G, dt);
  if (info.shots) Sound.play('shot');
  const biting = info.biting;
  // 看門的：每排門口一位，用掉的淡出
  for (let r = 0; r < ROWS; r++) {
    let g = gateEls[r];
    if (!g) { g = document.createElement('div'); g.className = 'gate'; g.style.top = `calc(${r} * 100% / var(--rows, 5))`; g.innerHTML = `<span>${icoImg('🧍')}</span>`; g.addEventListener('click', () => toast(G.gates.includes(r) ? GATE_TIP : '這排的看門的已經用掉了，再漏一隻地面敵人就守不住', true)); $('#shell').appendChild(g); gateEls[r] = g; }
    const on = G.gates.includes(r);
    g.classList.toggle('none', !G.gateRows.includes(r)); // 這個難度本來就沒有的排
    if (g.classList.contains('used') === on) {
      g.classList.toggle('used', !on);
      if (!on && G.gateRows.includes(r)) { g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash'); } // 用掉：門口閃紅一下（減少動態也閃，只是短）
      if (!on && !REDUCE_MOTION.matches && speed <= 1) g.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(45%)', offset: .35 }, { transform: 'translateX(0)' }], { duration: 520, easing: EASE_OUT }); // 用掉那一刻：往門裡跨一步再退回來變灰
    }
  }
  if (biting) Sound.play('bite'); // sound.js 自己限流，每 0.45 秒最多一聲
  $('#bar > i').style.transform = `scaleX(${G.total ? (G.killed / G.total).toFixed(3) : 0})`;
  const nUnits = Object.keys(G.units).length;
  if (nUnits !== lastUnits) { lastUnits = nUnits; if (selected) markHints(); }
  const f = Math.floor(G.food);
  if (f !== lastFood) { lastFood = f; for (const c of cardEls) c.classList.toggle('poor', !G.level.conveyor && f < UNITS[c.dataset.key].cost); }
  if (G.level.maxUnits) for (const c of cardEls) { const cap = G.level.maxUnits[c.dataset.key]; if (cap !== undefined) c.classList.toggle('capped', Engine.countUnits(G, c.dataset.key) >= cap); }
  if (tut.on && tut.waiting && f >= TUT_STEPS[tut.step].need) tutShow();
}

// ====== 勝負 ======
function endGame(title, text) {
  Board.setStill(true); // 結算頁底下的棋盤不再呼吸、走路
  $('#result-title').textContent = title;
  $('#result-text').textContent = text;
  $('#psalm').innerHTML = ''; $('#stars').innerHTML = ''; $('#stars-note').textContent = '';
  $('#result').hidden = false;
}
function recordBest(cleared) {
  const k = level.id + ':' + diff;
  const score = cleared ? G.waves.length + 1 : G.wave;
  const old = P.best[k] || {};
  if (!(old.score >= score)) P.best[k] = { score, cleared, wave: G.wave };
  if (cleared) (P.cleared[level.id] = P.cleared[level.id] || {})[diff] = true;
  // 星級：零損失與看門的跨局累積（OR）；開過開發者模式的那局不算
  const st = cleared && G.result && G.result.stars;
  if (st && !devUsed) { const o = P.stars[level.id] || {}; P.stars[level.id] = { noLoss: !!(o.noLoss || st.noLoss), gates: !!(o.gates || st.gates) }; }
  return saveProgress();
}
function showStars() {
  const st = (G.result && G.result.stars) || {}, slots = Engine.starSlots(level);
  const items = [['win', '守過'], ['noLoss', '零損失'], ['gates', '看門的都在']].slice(0, slots);
  const box = $('#stars'); box.innerHTML = '';
  items.forEach(([k, name], i) => { const d = document.createElement('span'); d.className = 'st' + (st[k] ? ' on' : ''); d.style.setProperty('--i', i); d.textContent = (st[k] ? '★ ' : '☆ ') + name; box.appendChild(d); });
  const why = [];
  if (!st.noLoss && G.sheepLost) why.push(`失了 ${G.sheepLost} 隻羊`);
  if (slots > 2 && !st.gates) why.push(`用掉了 ${G.gateRows.length - G.gates.length} 位看門的`);
  const got = items.filter(([k]) => st[k]).length;
  $('#stars-note').textContent = devUsed ? '開著開發者模式，這局的星不記' : got >= slots ? '這一夜的星全拿了' : why.length ? `差的：${why.join('；')}` : '';
  if (!devUsed) items.forEach(([k], i) => { if (st[k]) setTimeout(() => Sound.play('food'), 350 + i * 180 + 120); }); // 每顆星一聲叮，跟著跳出
}
function onWin() {
  Sound.ambient(false); Sound.play('dawn');
  const saved = recordBest(true);
  if (saved) clearCheckpoint(level.id); // 紀錄沒存進去就不清檢查點：至少還能「繼續上次」重守最後一波，不會畫面說守過、重開卻什麼都沒有
  const next = Engine.nextOf(level.id);
  dawn();
  setTimeout(() => { // 先讓人看到天亮，結算頁慢 0.9 秒出來（減少動態：立刻）
    const left = level.noShepherd ? `剩 ${Math.floor(G.food)} 糧。` : ''; // 第 25 夜一筆糧：天亮時剩多少（提案 §4 要記的那一筆，先給玩家看；調 startFood 用）
    endGame('天亮了 🌅', `${DIFFS[diff].name}守過了。${sheepSummary()}${left}${level.outroWin}${saved ? '' : ' ' + SAVE_FAILED_NOTE}`);
    showStars();
    $('#next').hidden = !next; $('#retry').textContent = '再守這一夜';
    if (level.psalm) {
      const box = $('#psalm');
      if (level.psalmTitle) { const h = document.createElement('div'); h.className = 'ref'; h.textContent = level.psalmTitle; box.appendChild(h); setTimeout(() => h.classList.add('on'), 300); } // 不認識的人也知道這是哪一篇（2026-10-20 G2）
      level.psalm.forEach((line, i) => { const d = document.createElement('div'); d.textContent = line; box.appendChild(d); setTimeout(() => d.classList.add('on'), 600 + i * 1500); });
    }
  }, REDUCE_MOTION.matches ? 0 : 900);
}
// 結語依實際羊數選（2026-10-21 小居第 6 項）：有羊數的夜才講；接回幾隻、失去幾隻、圈裡剩幾隻都從引擎帶，不再一句「一隻不少」到底
function sheepSummary() {
  if (!level.sheep) return '';
  const start = level.sheep, now = G.sheep, saved = G.sheepSaved || 0, lost = G.sheepLost || 0;
  if (!lost) return saved ? `${saved} 隻迷羊全接回來了，圈裡從 ${start} 隻變 ${now} 隻。` : `羊一隻沒少，圈裡 ${now} 隻。`;
  const head = saved ? `接回 ${saved} 隻迷羊、失去 ${lost} 隻，` : `失去 ${lost} 隻，`;
  if (now > start) return `${head}圈裡 ${now} 隻，比昨晚多 ${now - start} 隻。`;
  if (now === start) return `${head}圈裡還是 ${now} 隻。`;
  return `${head}圈裡剩 ${now} 隻。`;
}
function onLose(reason, by) {
  Sound.ambient(false); Sound.play('lose');
  recordBest(false); clearCheckpoint(level.id);
  const who = by && ENEMIES[by] ? ENEMIES[by].name : null; // 標題寫闖進來的那一隻的名字：夜鴞就是夜鴞、母熊就是母熊，不再一律翻成狼／鷙鳥
  const titles = { wolf: `${who || '狼'}闖進羊圈了`, bird: `${who || '鷙鳥'}飛進羊圈了`, sheep: '羊被偷光了' };
  const text = (level.outroLose && (level.outroLose[reason] || level.outroLose.wolf)) || '';
  nightfall();
  setTimeout(() => { endGame(titles[reason] || '守夜失敗', `你撐到了第 ${G.wave} 波。${text}`); $('#next').hidden = true; $('#retry').textContent = '再守一夜'; }, REDUCE_MOTION.matches ? 0 : 900);
}

// ====== 開始／重來 ======
function clearBoard() {
  cancelAnimationFrame(raf);
  Board.clear(); // 棋盤上的東西全收掉、停止重畫（不白耗電）
  selected = null; clearRange();
  document.querySelectorAll('.card').forEach(x => x.classList.remove('selected'));
  tut.on = false; $('#tut-skip').classList.remove('on');
  $('#result').hidden = true;
}
function startGame(fromCp) {
  // 開始、重來、下一夜、繼續上次都走這裡：棋盤還沒就緒（圖還在載／開不了 WebGL）一律擋下，不然畫面層會對著半套圖層丟例外
  if (!boardReady) { toast(Board.ready ? '棋盤圖還在載入，等一下再按' : '這支瀏覽器開不了棋盤畫面', true); return; }
  clearBoard();
  devUsed = devOn;
  if (fromCp) applyDiff(fromCp.diff, false); // 續玩用存檔那一夜的難度，只套用這一局；回開場頁會換回平常的預設
  const fresh = () => { G = Engine.create(level.id, diff); const lo = pickedFor(level); if (lo) Engine.applyPick(G, lo); }; // 只帶點兵選的卡
  fresh();
  setBoardRows(level.hill !== undefined && level.hill !== null ? ROWS + HILL_DROP : ROWS); // 有坡的夜棋盤拉高一排
  let resumed = false, broken = false;
  if (fromCp) {
    try { resumed = Engine.restore(G, fromCp); } catch (e) { resumed = false; }
    if (!resumed) { broken = true; fresh(); } // 還原到一半壞掉就整個重建，不留半套
  }
  // 重新開始「同一關」才丟掉舊檢查點（每關各一份，別關不動）；開著開發者面板這局不會存，舊檔一併清掉免得之後重打
  if (!resumed || devUsed) clearCheckpoint(level.id);
  buildCards();
  $('#sheep').hidden = !level.sheep; $('#sheep-n').textContent = G.sheep;
  Board.newGame(G, { diff, speed, resumed }); // 石頭格、場上單位、入夜暖橘（續玩不做）
  for (let i = G.events.length - 1; i >= 0; i--) if (G.events[i].t === 'unit') G.events.splice(i, 1); // 單位已直接畫了，其餘事件留給第一幀
  toast(resumed ? `從第 ${G.wave + 1} 波繼續，場上的人都還在${devUsed ? '；開著開發者模式，這局不存檔' : ''}` : broken ? CP_BROKEN : '先點一張卡，再點草地放下去');
  dawned = false; $('#shell').classList.remove('dawn');
  draw(0);
  if (!resumed && level.id === 1 && (!tutDone() || /[?&]tut/.test(location.search))) tutStart();
  last = performance.now();
  raf = requestAnimationFrame(tick);
  Sound.ambient(true);
}
function backToLevels() {
  clearBoard(); Sound.ambient(false);
  if (G) G.over = true; // 中途回關卡不清檢查點，之後可以「繼續上次」
  if (saveFailed && saveProgress()) toast('剛才沒存進去的紀錄，這次存好了'); // 上次寫失敗的永久進度再試一次（P 在記憶體裡還是對的）
  paused = false; $('#pause').hidden = true; syncPause();
  buildLevels();
  $('#intro').hidden = true; $('#result').hidden = true; $('#levels').hidden = false;
}


// ====== 點兵與圖鑑 ======
// 一關的卡超過 MAX_CARDS 張就要點兵；帶哪幾張存在這支手機，每關各存一份
const LKEY = 'sheepfold-loadout';
const sessionPick = {};   // 這次開著的頁面裡各關選好的名單；localStorage 寫不進去也照用
const GROUP = { producer: 0, shooter: 1, dog: 1, blocker: 2, floor: 3, instant: 4, support: 4 }; // 卡片固定分組
const sortUnits = keys => [...keys].sort((a, b) => GROUP[UNITS[a].kind] - GROUP[UNITS[b].kind] || keys.indexOf(a) - keys.indexOf(b));
function loadLoadouts() { try { return JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; } catch (e) { return {}; } }
function saveLoadout(id, keys) { sessionPick[id] = keys; try { const a = loadLoadouts(); a[id] = keys; localStorage.setItem(LKEY, JSON.stringify(a)); } catch (e) {} }
// 這一關實際上場的卡；卡不超過上限就回 null（全帶）
function pickedFor(L) {
  if (L.conveyor || L.units.length <= MAX_CARDS) return null; // 送卡模式沒得選，卡是送來的
  const s = sessionPick[L.id] || loadLoadouts()[L.id];
  return Engine.validPick(L, s) ? s : Engine.defaultPick(L);
}
// 玩家有沒有為這一關點過兵（存檔失效也算沒點過，開始前會再問一次）
const hasLoadout = L => Engine.validPick(L, sessionPick[L.id] || loadLoadouts()[L.id]);

const roster = { mode: 'view', tab: 'units', picked: new Set(), focus: null, units: [], from: 'levels' };
// mode 'pick'＝這一關要點兵；'view'＝從關卡選單看圖鑑（所有已開放的單位）
function openRoster(mode, from) {
  roster.mode = mode; roster.tab = 'units'; roster.focus = null; roster.from = from || 'levels'; pendingCp = null;
  if (mode === 'pick') {
    roster.units = sortUnits(level.units);
    roster.picked = new Set(pickedFor(level) || level.units);
    $('#roster-title').textContent = '今晚的隊伍';
    $('#roster-sub').textContent = `營火邊點名，今晚一起守夜的夥伴。${level.units.length} 張卡只能帶 ${MAX_CARDS} 張`;
  } else if (roster.from === 'pause') { // 對局中暫停查圖鑑：只列這一夜同行的卡，遊戲維持暫停
    roster.units = sortUnits(level.units); roster.picked = new Set();
    $('#roster-title').textContent = '圖鑑';
    $('#roster-sub').textContent = '這一夜同行的夥伴、遇見的野獸，和效果名詞。狼也在等，看完回暫停';
  } else {
    roster.units = sortUnits(unlockedUnits()); roster.picked = new Set();
    $('#roster-title').textContent = '圖鑑';
    const extra = roster.units.length - level.units.length;
    $('#roster-sub').textContent = roster.from === 'intro' && extra > 0
      ? `這一夜只有亮著的 ${level.units.length} 位同行；暗掉的是後面的夜才會遇見的夥伴，帶不回來`
      : '守過的夜裡遇見的人、狗和野獸';
  }
  $('#roster-go').hidden = mode !== 'pick';
  $('#roster-back').textContent = roster.from === 'intro' ? '回開場' : roster.from === 'pause' ? '回暫停' : '回關卡';
  renderRoster();
  $('#levels').hidden = true; $('#intro').hidden = true; $('#pause').hidden = true; $('#roster').hidden = false;
}
function renderRoster() {
  const grid = $('#roster-grid'); grid.innerHTML = '';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('selected', b.dataset.tab === roster.tab));
  if (roster.tab === 'units') {
    for (const k of roster.units) {
      const u = UNITS[k], d = document.createElement('div');
      const fresh = (roster.mode === 'pick' || roster.from === 'intro') && level.fresh.includes(k);
      const away = roster.mode !== 'pick' && roster.from === 'intro' && !level.units.includes(k); // 這一夜不同行的夥伴
      d.className = 'rc' + (roster.mode === 'pick' ? (roster.picked.has(k) ? ' on' : ' off') : away ? ' off' : '') + (u.kind === 'instant' ? ' once' : '') + (roster.focus === k ? ' focus' : '');
      d.dataset.key = k;
      d.style.setProperty('--u', `var(--u-${k})`);
      d.innerHTML = `<div class="dot"></div>${fresh ? '<div class="tag fresh">新</div>' : ''}${u.kind === 'instant' ? '<div class="tag once">一次</div>' : ''}<div class="ico">${icoImg(u.ico)}</div><div class="name">${u.name}</div><div class="cost">🌾 ${u.cost}</div>`;
      d.addEventListener('click', () => tapRoster(k));
      grid.appendChild(d);

  { name: '山坡', ico: '⛰️', text: `第三章左邊四格是高地、右邊三格（第 5-7 格）是斜坡：羊圈在山上，敵人從山下爬上來。高地的直射（石子、箭、機弦）飛到坡緣就從斜坡上敵人的頭頂飛過去，打不到牠們；上了坡緣（第 4 格）才打得到。拋射（投石機、拋石手）、飛的敵人不受影響；放在斜坡三格的單位跟敵人同一個斜面，一切照舊。地面敵人在斜坡上走得慢（×${HILL_SLOW}），野牛例外。這是規則，不是漏洞：火盆、投石隊、弓箭手在這一章會掉價` },
  { name: '拋射', ico: '🪃', text: `石頭拋上天再落下，飛得過山坡、厚皮也全額；飛 0.8 秒才落地，跑得快的偶爾會走掉。來源：投石機（拋最遠的、濺射 ${UNITS.catapult.splash} 格）、拋石手（拋最前面的、落點 ${UNITS.lobber.splash} 格）` },
  { name: '滾石', ico: '🪨', text: `石堆被咬垮、撞垮或自己點一下推倒，石頭滾下坡：這排在它右邊的地面敵人各受傷 ${UNITS.cairn.rollDmg}、退 ${UNITS.cairn.rollPush} 格、暈 ${UNITS.cairn.rollStun} 秒；野牛只受傷。鏟除、換樓不滾` },
  { name: '困住', ico: '🕳️', text: `陷坑：第一隻踩進來的地面敵人不動也不咬 ${UNITS.pit.trap} 秒（頭目 ${UNITS.pit.trapBoss} 秒），坑就塌了。挖在斜坡第一格（第 5 格），困住的敵人卡在坡緣，高地的射手打得到；是唯一困得住野牛的東西` },
  { name: '飛高', ico: '🦅', text: '大鷹飛進來時飛得高，任何投射物、瓦瓶都打不到。守望樓那一排牠飛不高，一進場就打得到；抓了羊往回飛也會變低。飛出場前打下來，羊落地自己走回圈' },
  { name: '推不動', ico: '🐂', text: `野牛：角聲、瓦瓶、滾石推不動也嚇不暈牠，狗不理牠，斜坡上不減速，荊棘只減到 ×${STATUS.slow.heavyMul}。撞牆第一下 ${ENEMIES.aurochs.slam}、咬牆 ×${ENEMIES.aurochs.wallMul}、厚皮。對策：陷坑困住牠那 ${UNITS.pit.trapBoss} 秒，機弦手、投石機、拋石手一起打` },
  { name: '丟石頭', ico: '🧔‍♂️', text: `強盜走到斜坡第 2 格（第 6 格）就站住不走，每 ${ENEMIES.robber.throws.every} 秒朝這排最前面的夥伴丟一顆石頭（${ENEMIES.robber.throws.dmg} 傷害）。高地的直射打不到牠；狗跑過去咬、拋石手砸、推倒石堆都行。牆前面堆一個石堆，石頭就先丟石堆` },
  { name: '一筆糧', ico: '🌾', text: '第 25 夜：沒有牧人這張卡，糧也不會自己滴，開局那一筆用完就沒了。鏟子退一半照舊；天亮後剩多少糧，結算會告訴你' },
];
function renderRosterDetail() {
  const box = $('#roster-detail'), k = roster.focus;
  if (!k) { box.innerHTML = roster.mode === 'pick' ? '點一下選或取消，說明會顯示在這裡' : '點一個看說明'; return; }
  if (roster.tab === 'effects') { const g = GLOSSARY[+k]; if (g) box.innerHTML = `<b>${icoImg(g.ico)} ${g.name}</b><br>${g.text}`; return; }
  if (roster.tab === 'units') {
    const u = UNITS[k];
    const fresh = (roster.mode === 'pick' || roster.from === 'intro') && level.fresh.includes(k);
    const away = roster.mode !== 'pick' && roster.from === 'intro' && !level.units.includes(k);
    const learns = roster.from === 'intro' && u.upgrade && u.upgrade.from === Engine.posOf(level.id);
    const note = away ? '<br><span class="new">這一夜還沒遇見，要到後面的夜才會同行</span>' : fresh ? `<br><span class="new">這一夜新開的卡${roster.mode === 'pick' ? '，建議帶上' : ''}</span>` : learns ? `<br><span class="new">這一夜起學會「${u.upgrade.name}」：放下後再點一下</span>` : roster.mode === 'pick' && k === 'shepherd' ? '<br><span class="new">沒有牧人就沒有糧，一定帶</span>' : '';
    box.innerHTML = `<b>${icoImg(u.ico)} ${u.name}</b>　<span class="num">🌾 ${u.cost}</span><br>${u.desc}${note}<br><span class="num">${unitNums(k)}</span><div class="ref">${fullRef(u.ref)}${u.upgrade ? '・升級 ' + fullRef(u.upgrade.ref) : ''}</div>`;
  } else {
    const e = ENEMIES[k];
    box.innerHTML = `<b>${icoImg(e.ico)} ${e.name}</b><br>${e.tip || '最普通的一隻，走到最左邊就闖進羊圈'}<br><span class="num">${enemyNums(k)}</span>${e.ref ? `<div class="ref">${fullRef(e.ref)}</div>` : ''}`;
  }
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { roster.tab = b.dataset.tab; roster.focus = null; renderRoster(); }));
$('#roster-go').addEventListener('click', () => { if (roster.picked.size < MIN_CARDS) return; saveLoadout(level.id, sortUnits([...roster.picked])); $('#roster').hidden = true; const cp = pendingCp; pendingCp = null; startGame(cp); });
$('#roster-back').addEventListener('click', () => { $('#roster').hidden = true; if (roster.from === 'intro') { showIntroNew(level); $('#intro').hidden = false; } else if (roster.from === 'pause') $('#pause').hidden = false; else $('#levels').hidden = false; });
$('#intro-roster').addEventListener('click', () => openRoster(pickedFor(level) ? 'pick' : 'view', 'intro'));
$('#levels-codex').addEventListener('click', () => openRoster('view', 'levels'));

// ====== 第 1 關手把手（只教一次；網址加 ?tut 可重看） ======
const TKEY = 'sheepfold-tutorial-done';
const TUT_STEPS = [
  { card: 'shepherd', cell: [2, 0], say: '先點「牧人」卡，再點亮著的格子。牧人會產糧' },
  { card: 'slinger',  cell: [2, 1], need: 100, wait: '牧人會送糧來，等糧到 100', say: '點「投石手」，放在牧人右邊。他朝這一排丟石頭' },
  { card: 'wall',     cell: [2, 4], need: 50,  wait: '再等一下，糧到 50',       say: '點「石牆」，放在前面擋路。狼會先咬牆' },
];
const tut = { on: false, step: 0, waiting: false };
function tutDone() { try { return localStorage.getItem(TKEY) === '1'; } catch (e) { return false; } }
function tutStart() { tut.on = true; tut.step = 0; G.holdWaves = true; $('#tut-skip').classList.add('on'); tutShow(); }
function tutShow() {
  const st = TUT_STEPS[tut.step], ready = !st.need || G.food >= st.need;
  tut.waiting = !ready;
  document.querySelectorAll('#cards .card').forEach(c => c.classList.toggle('dim', !ready || c.dataset.key !== st.card));
  Board.setTeach(ready ? st.cell : null);
  toast(ready ? st.say : st.wait, true);
}
function tutAdvance() {
  tut.step++;
  if (tut.step >= TUT_STEPS.length) return tutEnd(`做得好。腳印預告狼從哪排來，每排都要有射手。${gateAdvice(level, diff)}`);
  tutShow();
}
function tutEnd(msg) {
  tut.on = false; if (G) G.holdWaves = false;
  document.querySelectorAll('#cards .card').forEach(c => c.classList.remove('dim'));
  Board.setTeach(null);
  $('#tut-skip').classList.remove('on');
  try { localStorage.setItem(TKEY, '1'); } catch (e) {}
  if (msg) toast(msg, true);
}
$('#tut-skip').addEventListener('click', () => tutEnd('好，自己來。狼要來了'));

// ====== 暫停與檢查點 ======
// 暫停：上方 ⏸ 或切到背景；畫面蓋一層，按繼續才走
// 暫停狀態同步到畫面：棋盤循環動畫停、開發者面板的暫停鍵字樣跟著變
const heldAnims = []; // 暫停時被我們停住的 WAAPI 動畫（走道上看門的跨步、外框震動），恢復時放回去；棋盤 canvas 的動畫由 render.js 自己停
const isCssAnim = a => (typeof CSSAnimation !== 'undefined' && a instanceof CSSAnimation) || (typeof CSSTransition !== 'undefined' && a instanceof CSSTransition);
function syncPause() {
  Board.setPaused(paused); $('#dev-pause').classList.toggle('on', paused); $('#dev-pause').textContent = paused ? '繼續' : '暫停';
  const shell = $('#shell'); if (!shell || !shell.getAnimations) return;
  if (paused) { for (const a of shell.getAnimations({ subtree: true })) if (!isCssAnim(a) && a.playState === 'running') { a.pause(); heldAnims.push(a); } }
  else for (const a of heldAnims.splice(0)) if (a.playState === 'paused') a.play();
}
function pauseGame() {
  if (!G || G.over || paused) return;
  if (!$('#result').hidden || !$('#roster').hidden || !$('#intro').hidden || !$('#levels').hidden) return;
  paused = true; $('#pause').hidden = false; syncPause(); syncSoundUI();
  $('#pause-note').textContent = `狼也在等。回來再按繼續。${checkpointNote()}`;
}
function resumeGame() {
  paused = false; $('#pause').hidden = true; syncPause();
  last = performance.now();
}
$('#pause-btn').addEventListener('click', pauseGame);
$('#resume-btn').addEventListener('click', resumeGame);
$('#pause-codex').addEventListener('click', () => openRoster('view', 'pause')); // 暫停中查圖鑑，看完回暫停
$('#pause-back').addEventListener('click', () => { resumeGame(); backToLevels(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pauseGame(); Sound.suspend(); } else Sound.resume(); });

// ====== 聲音設定 ======
// 頂欄與開場頁的喇叭：一下切全部靜音；暫停層裡才有細項（音效／蟲鳴／音量三檔）
function syncSoundUI() {
  const p = Sound.prefs;
  document.querySelectorAll('.snd-btn').forEach(b => { b.textContent = p.sfx ? '🔊' : '🔇'; b.title = p.sfx ? '聲音：開（點一下靜音）' : '聲音：關（點一下打開）'; });
  document.querySelectorAll('#snd-panel [data-snd]').forEach(b => { const on = !!p[b.dataset.snd]; b.textContent = on ? '開' : '關'; b.classList.toggle('on', on); });
  document.querySelectorAll('#snd-panel [data-vol]').forEach(b => b.classList.toggle('on', Number(b.dataset.vol) === p.vol));
  document.querySelectorAll('#snd-panel .snd-row').forEach((row, i) => row.classList.toggle('off', i > 1 && !p.sfx)); // 第 0 列是大字、第 1 列是音效開關，之後的才跟著音效壓暗
}
document.querySelectorAll('.snd-btn').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); Sound.set('sfx', !Sound.prefs.sfx); syncSoundUI(); Sound.play('tap'); }));
document.querySelectorAll('#snd-panel [data-snd]').forEach(b => b.addEventListener('click', () => { Sound.set(b.dataset.snd, !Sound.prefs[b.dataset.snd]); syncSoundUI(); Sound.play('tap'); }));
document.querySelectorAll('#snd-panel [data-vol]').forEach(b => b.addEventListener('click', () => { Sound.set('vol', Number(b.dataset.vol)); syncSoundUI(); Sound.play('clear'); }));
// iOS 要有一次手勢才能出聲：第一次點任何地方就把聲音打開
document.addEventListener('pointerdown', () => Sound.unlock(), { capture: true, passive: true });
// 大字只放大文字，棋盤與底部提示仍受同一個視窗高度限制。
function applyBig(on, save = true) { document.documentElement.classList.toggle('big', !!on); const b = $('#big-btn'); b.textContent = on ? '開' : '關'; b.classList.toggle('on', !!on); if (save) try { localStorage.setItem('sheepfold-bigtext', on ? '1' : '0'); } catch (e) {} }
$('#big-btn').addEventListener('click', () => { applyBig(!document.documentElement.classList.contains('big')); Sound.play('tap'); });
try { applyBig(localStorage.getItem('sheepfold-bigtext') === '1', false); } catch (e) {}
syncSoundUI();

// 檢查點：每清完一波存一次，每關各存一份（去玩別關不會蓋掉）；守完、輸了、重新開始同一關只清自己這關的
const CKEY = id => `sheepfold-checkpoint-${id}`;
function loadCheckpoint(id) { try { const c = JSON.parse(localStorage.getItem(CKEY(id)) || 'null'); return c && typeof c === 'object' ? c : null; } catch (e) { return null; } }
function saveCheckpoint(snap) {
  try {
    const text = JSON.stringify(snap), key = CKEY(snap.levelId);
    localStorage.setItem(key, text);
    return localStorage.getItem(key) === text;
  } catch (e) { return false; }
}
function checkpointNote() {
  const cp = loadCheckpoint(level.id);
  if (cp && Engine.checkSnapshot(cp, level.id)) return `已存到${DIFFS[cp.diff].name}第 ${cp.wave} 波結束，可從第 ${cp.wave + 1} 波繼續。`;
  return '目前沒有可用的檢查點，離開後需從這一夜開頭重來。';
}
function clearCheckpoint(id) { try { localStorage.removeItem(CKEY(id)); } catch (e) {} }
// 舊版只有一份存檔：搬到那一關自己的欄位，不讓玩家的進度不見
try { const old = JSON.parse(localStorage.getItem('sheepfold-checkpoint') || 'null'); if (old && old.levelId && !localStorage.getItem(CKEY(old.levelId))) localStorage.setItem(CKEY(old.levelId), JSON.stringify(old)); localStorage.removeItem('sheepfold-checkpoint'); } catch (e) {}
// 續玩前要點兵：存檔裡場上的單位一定勾著，其餘照預設補滿，卡列和棋盤才對得上
function prepickFromCp(cp) {
  const s = new Set(level.units.includes('shepherd') ? ['shepherd'] : []); // 一筆糧的夜沒有牧人這張卡
  for (const u of cp.units) if (level.units.includes(u.type)) s.add(u.type);
  for (const k of pickedFor(level)) if (s.size < MAX_CARDS) s.add(k);
  roster.picked = s; renderRoster();
}
$('#resume-cp').addEventListener('click', () => {
  const cp = loadCheckpoint(level.id);
  if (!Engine.checkSnapshot(cp, level.id)) { openIntro(level); return; } // 壞檔交給開場頁：清掉並說明，文案只有一份
  if (pickedFor(level) && !hasLoadout(level)) { openRoster('pick', 'intro'); pendingCp = cp; prepickFromCp(cp); return; } // 跟「開始守夜」一樣先點兵
  $('#intro').hidden = true; startGame(cp); // 難度在 startGame 裡才套用，點兵頁退出不會留下來
});

// ====== 開發者面板 ======
function setDev(on) {
  devOn = on; $('#dev').classList.toggle('on', on); if (on) devUsed = true;
  if (on) toast('開發者模式開了：可加速、加糧、任意格放敵人');
}
function buildDevEnemies() {
  const sel = $('#dev-enemy');
  for (const k in ENEMIES) { const o = document.createElement('option'); o.value = k; o.textContent = ENEMIES[k].ico + ' ' + ENEMIES[k].name; sel.appendChild(o); }
  const so = document.createElement('option'); so.value = 'stray'; so.textContent = STRAY.ico + ' ' + STRAY.name + '（中立）'; sel.appendChild(so);
  sel.addEventListener('change', () => { devEnemy = sel.value; if (devEnemy) { selected = null; document.querySelectorAll('.card').forEach(x => x.classList.remove('selected')); hintMap = new Map(); Board.setHints(null); toast(`點任一格，放一隻${devEnemy === 'stray' ? STRAY.name : ENEMIES[devEnemy].name}`); } });
}
document.querySelectorAll('#dev [data-speed]').forEach(b => b.addEventListener('click', () => setSpeed(Number(b.dataset.speed))));
$('#dev-pause').addEventListener('click', () => { paused = !paused; syncPause(); if (!paused) last = performance.now(); });
$('#dev-food').addEventListener('click', () => { if (G) { Engine.dev.food(G, 500); draw(); } });
$('#dev-all').addEventListener('click', () => { if (G) { Engine.dev.allCards(G); buildCards(); toast('這一局全部的卡都能用'); } });
$('#dev-next').addEventListener('click', () => { if (G) { Engine.dev.nextWave(G); flushEvents(); draw(); } });
$('#dev-clear').addEventListener('click', () => { if (G) { Engine.dev.clear(G); flushEvents(); draw(); } });
{ let holdT = 0; const fs = $('#top span:first-child'); const stop = () => { clearTimeout(holdT); holdT = 0; };
  fs.addEventListener('pointerdown', () => { stop(); holdT = setTimeout(() => { holdT = 0; setDev(!devOn); }, 1500); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) fs.addEventListener(ev, stop);
  fs.addEventListener('contextmenu', e => e.preventDefault()); } // 長按時手機會跳選單，擋掉
buildDevEnemies(); setDev(devOn);

// 組合字 emoji（🧑‍🌾、🐕‍🦺 這種用零寬連接符拼的）在舊 Android／Windows 會拆成兩個字：量一下寬度，拆開的就換成單一碼位的替身（2026-10-20 P2）
(function emojiFallback() {
  try {
    const cv = document.createElement('canvas').getContext('2d'); if (!cv) return;
    cv.font = '32px -apple-system, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
    const w = t => cv.measureText(t).width;
    const broken = t => t.includes('\u200d') && w(t) > w(t.split('\u200d')[0]) * 1.5; // 拼不起來＝比第一個字寬太多
    const FALLBACK = { shepherd: '🧑', digger: '🐩' };
    for (const [k, alt] of Object.entries(FALLBACK)) { const d = UNITS[k] || ENEMIES[k]; if (d && broken(d.ico)) d.ico = alt; }
  } catch (e) {}
})();
buildBoard(); buildLevels(); // buildBoard 是非同步的（載圖）；開始守夜前會確認棋盤已就緒
try { diff = localStorage.getItem('sheepfold-diff') || 'calm'; } catch (e) {}
if (!DIFFS[diff]) diff = 'calm';
document.querySelectorAll('.diff').forEach(b => b.addEventListener('click', () => applyDiff(b.dataset.key)));
$('#start').addEventListener('click', () => { if (!boardReady) { toast(Board.ready ? '棋盤圖還在載入，等一下再按' : '這支瀏覽器開不了棋盤畫面', true); return; } markIntroSeen(); if (pickedFor(level) && !hasLoadout(level)) { openRoster('pick', 'intro'); return; } $('#intro').hidden = true; startGame(); });
$('#intro-back').addEventListener('click', backToLevels);
$('#retry').addEventListener('click', () => startGame());
$('#back').addEventListener('click', backToLevels);
$('#next').addEventListener('click', () => { const nx = Engine.nextOf(level.id); clearBoard(); if (nx) openIntro(nx); else backToLevels(); });
</script>
