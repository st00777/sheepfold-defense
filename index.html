<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2a26">
<title>羊圈守夜</title>
<style>
  /* 色票集中在這裡，之後換美術只改這一區 */
  :root {
    --bg: #2b2a26;         /* 夜色底 */
    --panel: #3a3831;      /* 面板 */
    --grass: #4f6b3a;      /* 草地格 */
    --grass2: #5a7a43;     /* 草地格（交錯色） */
    --rock: #5a5650;       /* 石頭格 */
    --line: #2e3d24;
    --text: #f3ead8;
    --muted: #b9b09c;
    --gold: #e6b84a;       /* 糧 */
    --danger: #d9534f;
    --ok: #7bc47f;
    --card: #4a4639;
    --card-on: #6e6447;
    --new: #ffd98a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; min-height: 100dvh; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

  /* 上方資源列 */
  #top { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--panel); font-size: 15px; }
  #top b { font-size: 18px; }
  #food { color: var(--gold); }
  #sheep[hidden] { display: none; }
  #wave-info { color: var(--muted); }

  /* 卡片列：可以左右滑 */
  #cards { display: flex; gap: 8px; padding: 8px 12px; background: var(--panel); border-top: 1px solid #000; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  #cards::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 68px; background: var(--card); border: 2px solid transparent; border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer; transition: transform .08s; min-height: 64px; position: relative; }
  .card .ico { font-size: 26px; line-height: 1; }
  .card .name { font-size: 12px; margin-top: 2px; white-space: nowrap; }
  .card .cost { font-size: 12px; color: var(--gold); }
  .card.selected { border-color: var(--gold); background: var(--card-on); }
  .card.poor { opacity: .45; }
  .card.new { animation: glow 1.4s infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 0 0 #ffd98a00; } to { box-shadow: 0 0 10px 2px var(--new); } }
  .card.shake { animation: shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  /* 棋盤 */
  #board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; }
  #board { position: relative; width: 100%; max-width: 640px; aspect-ratio: 7 / 5; display: grid;
    grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(5, 1fr); border: 3px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cell { position: relative; background: var(--grass); display: flex; align-items: center; justify-content: center; font-size: clamp(18px, 6vw, 36px); }
  .cell.alt { background: var(--grass2); }
  .cell.rock { background: var(--rock); }
  .cell.rock::after { content: '🪨'; opacity: .7; font-size: .8em; }
  .cell.hint { outline: 2px dashed var(--gold); outline-offset: -4px; }
  .cell .unit { position: relative; display: flex; align-items: center; justify-content: center; width: 80%; height: 80%; border-radius: 8px; }
  .unit.shepherd { background: #3d6ea8; }
  .unit.shepherd.elder { background: #2f5a8f; box-shadow: inset 0 0 0 2px var(--gold); }
  .unit.slinger  { background: #a8553d; }
  .unit.sling    { background: #8a3f2e; }
  .unit.hireling { background: #7d7a6a; }
  .unit.archer   { background: #6b4e2e; }
  .unit.wall     { background: #777; }
  .unit.tower    { background: #5c5c66; }
  .unit.dog      { background: transparent; opacity: .35; font-size: .6em; }
  .unit.scorpion, .unit.thorns { background: transparent; }
  .unit.brazier  { background: #6e3a1e; }
  .unit.horn     { background: #7a6a2a; }
  .unit.healer   { background: #3d8a7a; }
  .unit.catapult { background: #5a4a3a; }
  .unit .hp, .enemy .hp, .dog-run .hp { position: absolute; left: 10%; right: 10%; bottom: 2px; height: 3px; background: #0006; }
  .hp > i { display: block; height: 100%; background: var(--ok); }
  .unit.fear { filter: grayscale(.8); }
  .unit .badge { position: absolute; top: -4px; right: -4px; font-size: 11px; background: #000a; border-radius: 8px; padding: 0 4px; }

  /* 敵人、狗、石頭用絕對定位，位置用百分比 */
  .enemy, .dog-run, .mark { position: absolute; width: calc(100% / 7); height: calc(100% / 5); display: flex; align-items: center; justify-content: center; font-size: clamp(18px, 6vw, 36px); pointer-events: none; }
  .enemy .body { width: 70%; height: 70%; border-radius: 50%; background: #5b5b66; display: flex; align-items: center; justify-content: center; position: relative; }
  .enemy.fast .body { background: #8a4b6b; }
  .enemy.alpha .body { background: #3b2b4b; box-shadow: 0 0 0 2px #c9a0dc; }
  .enemy.big .body { background: #4a3a2a; }
  .enemy.human .body { background: #4a4a3a; border-radius: 30%; }
  .enemy.small .body { width: 50%; height: 50%; background: #6a5a3a; }
  .enemy.dig .body { background: #5a4a2a; }
  .enemy.underground { opacity: 0; }
  .enemy.fly { align-items: flex-start; }
  .enemy.fly .body { background: transparent; }
  .enemy.carry .body::after { content: '🐑'; position: absolute; right: -8px; bottom: -4px; font-size: .55em; }
  .enemy .hp > i { background: var(--danger); }
  .enemy .st { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: .45em; line-height: 1; white-space: nowrap; }
  .dog-run .body { width: 70%; height: 70%; border-radius: 50%; background: #c9a24a; display: flex; align-items: center; justify-content: center; position: relative; }
  .mark { right: 2px; font-size: clamp(14px, 4.5vw, 26px); opacity: .85; animation: blink .8s infinite alternate; }
  @keyframes blink { from { opacity: .35; } to { opacity: .95; } }
  .shot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #e9e4d0; pointer-events: none; }
  .shot.arrow { width: 18px; height: 3px; border-radius: 2px; background: #d8c8a0; }
  .shot.sling { width: 14px; height: 14px; background: #d0d0d0; }
  .shot.lob { width: 14px; height: 14px; background: #a9a9a9; }
  .shot.burn { background: #ff8a3d; box-shadow: 0 0 6px #ff8a3d; }
  .pop { position: absolute; color: var(--gold); font-weight: bold; font-size: 14px; pointer-events: none; animation: pop 1s forwards; }
  .fx { position: absolute; width: calc(100% / 7); height: calc(100% / 5); display: flex; align-items: center; justify-content: center; font-size: clamp(16px, 5vw, 30px); pointer-events: none; animation: pop 1.1s forwards; }
  .fx.stay { animation: blink .6s infinite alternate; }
  @keyframes pop { to { transform: translateY(-24px); opacity: 0; } }

  /* 底部進度條 */
  #bottom { padding: 8px 12px 14px; background: var(--panel); }
  #bar { height: 8px; background: #0006; border-radius: 4px; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }
  #toast { text-align: center; font-size: 13px; color: var(--muted); min-height: 18px; margin-top: 6px; }
  #toast.tip { color: var(--new); }

  /* 蓋在上面的對話／結果畫面 */
  .overlay { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; overflow-y: auto; }
  .overlay[hidden] { display: none; }
  .dialog { background: var(--panel); border-radius: 14px; padding: 22px 20px; max-width: 420px; width: 100%; text-align: center; margin: auto; }
  .dialog h1 { margin: 0 0 6px; font-size: 24px; }
  .dialog .ref { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .dialog p { line-height: 1.7; font-size: 15px; text-align: left; }
  .dialog .who { color: var(--gold); }
  .dialog .verse { background: #0004; border-left: 3px solid var(--gold); padding: 8px 10px; border-radius: 4px; }
  #diffs { display: flex; gap: 6px; margin: 10px 0 4px; }
  .diff { flex: 1; background: var(--card); color: var(--text); border: 2px solid transparent; border-radius: 10px; padding: 9px 0; font-size: 15px; font-family: inherit; cursor: pointer; }
  .diff.selected { border-color: var(--gold); background: var(--card-on); }
  #diff-hint { font-size: 12px; color: var(--muted); min-height: 16px; margin-bottom: 8px; }
  .btn.alt { background: transparent; color: var(--muted); border: 1px solid var(--muted); margin-top: 8px; }
  .btn { display: inline-block; margin-top: 12px; padding: 12px 28px; font-size: 17px; border-radius: 10px; border: 0; background: var(--gold); color: #2b2a26; font-weight: bold; cursor: pointer; font-family: inherit; }
  .btn[hidden] { display: none; }
  .tips { font-size: 13px; color: var(--muted); text-align: left; margin-top: 10px; line-height: 1.6; }
  .tips .new { color: var(--new); }
  #best { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* 關卡選單 */
  .lv { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 10px; padding: 10px 12px; margin-top: 8px; text-align: left; cursor: pointer; }
  .lv.locked { opacity: .45; cursor: default; }
  .lv .n { font-size: 20px; width: 28px; text-align: center; color: var(--gold); }
  .lv .t { flex: 1; }
  .lv .t b { display: block; font-size: 15px; }
  .lv .t span { font-size: 12px; color: var(--muted); }
  .lv .s { font-size: 12px; color: var(--ok); white-space: nowrap; }
  #psalm { text-align: left; font-size: 15px; line-height: 1.9; margin-top: 10px; }
  #psalm div { opacity: 0; transition: opacity 1.2s; }
  #psalm div.on { opacity: 1; }
</style>
</head>
<body>

<div id="top">
  <span>🌾 糧 <b id="food">0</b></span>
  <span id="sheep" hidden>🐑 <b id="sheep-n">3</b></span>
  <span id="wave-info">準備中</span>
</div>

<div id="cards"></div>

<div id="board-wrap"><div id="board"></div></div>

<div id="bottom">
  <div id="bar"><i></i></div>
  <div id="toast">先點一張卡，再點草地放下去</div>
</div>

<!-- 關卡選單 -->
<div class="overlay" id="levels">
  <div class="dialog">
    <h1>羊圈守夜</h1>
    <div class="ref">受託守夜的無名牧人。每一夜都是聖經裡牧人真的守過的夜。</div>
    <div id="lv-list"></div>
  </div>
</div>

<!-- 開場 -->
<div class="overlay" id="intro" hidden>
  <div class="dialog">
    <h1 id="intro-title"></h1>
    <div class="ref" id="intro-ref"></div>
    <p id="intro-text"></p>
    <div class="tips" id="intro-tips"></div>
    <div id="diffs">
      <button class="diff" data-key="calm">寧靜夜</button>
      <button class="diff" data-key="windy">起風夜</button>
      <button class="diff" data-key="storm">暴風夜</button>
    </div>
    <div id="diff-hint"></div>
    <button class="btn" id="start">開始守夜</button>
    <button class="btn alt" id="intro-back">回關卡</button>
    <div id="best"></div>
  </div>
</div>

<!-- 結果 -->
<div class="overlay" id="result" hidden>
  <div class="dialog">
    <h1 id="result-title"></h1>
    <p id="result-text"></p>
    <div id="psalm"></div>
    <button class="btn" id="next" hidden>下一夜</button>
    <button class="btn" id="retry">再守一夜</button>
    <button class="btn alt" id="back">回關卡</button>
  </div>
</div>

<script src="data.js?v=3"></script>
<script src="engine.js?v=3"></script>
<script>
'use strict';
// ROWS、COLS、UNITS、ENEMIES、DIFFS、LEVELS 由 data.js 直接提供
const $ = s => document.querySelector(s);
const board = $('#board');
const cells = [];
let G = null, level = LEVELS[0], diff = 'calm', selected = null, last = 0, raf = 0;
const els = new Map();   // 引擎物件 id → 畫面元素
let markerEl = null, moundEls = new Map();
let toastTimer = 0;

// ====== 進度（只存在這支手機） ======
const PKEY = 'sheepfold-progress-v3';
function loadProgress() {
  let p = { cleared: {}, best: {} };
  try { p = Object.assign(p, JSON.parse(localStorage.getItem(PKEY) || '{}')); } catch (e) {}
  // 舊版只有第一關的紀錄，搬過來
  try {
    const old = JSON.parse(localStorage.getItem('sheepfold-best-v2') || 'null');
    if (old && !p.migrated) { for (const k in old) { p.best['1:' + k] = old[k]; if (old[k].cleared) (p.cleared[1] = p.cleared[1] || {})[k] = true; } p.migrated = true; saveProgress(p); }
  } catch (e) {}
  return p;
}
let P = loadProgress();
function saveProgress(p) { try { localStorage.setItem(PKEY, JSON.stringify(p || P)); } catch (e) {} }
const unlockAll = /[?&]all/.test(location.search);
function unlocked(id) { return id === 1 || unlockAll || !!P.cleared[id - 1]; }

// ====== 畫面建立 ======
function buildBoard() {
  board.innerHTML = ''; cells.length = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const d = document.createElement('div');
    d.className = 'cell' + ((r + c) % 2 ? ' alt' : '');
    d.dataset.r = r; d.dataset.c = c;
    d.addEventListener('click', () => tapCell(r, c));
    board.appendChild(d); cells.push(d);
  }
}
function buildCards() {
  const wrap = $('#cards'); wrap.innerHTML = '';
  for (const key of level.units) {
    const u = UNITS[key];
    const d = document.createElement('div');
    d.className = 'card' + (level.fresh.includes(key) ? ' new' : ''); d.dataset.key = key;
    d.innerHTML = `<div class="ico">${u.ico}</div><div class="name">${u.name}</div><div class="cost">🌾 ${u.cost}</div>`;
    d.addEventListener('click', () => tapCard(key, d));
    wrap.appendChild(d);
  }
}
function buildLevels() {
  const list = $('#lv-list'); list.innerHTML = '';
  for (const L of LEVELS) {
    const ok = unlocked(L.id);
    const d = document.createElement('div');
    d.className = 'lv' + (ok ? '' : ' locked');
    const done = P.cleared[L.id] ? Object.keys(P.cleared[L.id]).map(k => DIFFS[k].name.slice(0, 2)).join('・') + ' ✅' : '';
    d.innerHTML = `<div class="n">${ok ? L.id : '🔒'}</div><div class="t"><b>${L.name}</b><span>${ok ? L.ref.replace('取材：', '') : '守過上一夜就會開'}</span></div><div class="s">${done}</div>`;
    if (ok) d.addEventListener('click', () => openIntro(L));
    list.appendChild(d);
  }
}
function openIntro(L) {
  level = L;
  $('#intro-title').textContent = L.title;
  $('#intro-ref').textContent = L.ref;
  const t = $('#intro-text');
  t.innerHTML = L.speaker ? `<span class="who">${L.speaker}：</span>${L.intro}` : `<div class="verse">${L.intro}</div>`;
  $('#intro-tips').innerHTML = L.fresh.map(k => `<div class="new">${UNITS[k].ico} ${UNITS[k].name}：${UNITS[k].desc}</div>`).join('') + (L.tips || []).map(x => `<div>${x}</div>`).join('');
  applyDiff(diff);
  showBest();
  $('#levels').hidden = true; $('#intro').hidden = false;
}
function applyDiff(key) {
  diff = key;
  document.querySelectorAll('.diff').forEach(b => b.classList.toggle('selected', b.dataset.key === key));
  $('#diff-hint').textContent = DIFFS[key].hint;
  try { localStorage.setItem('sheepfold-diff', key); } catch (e) {}
}
function showBest() {
  const lines = Object.keys(DIFFS).filter(k => P.best[level.id + ':' + k]).map(k => { const b = P.best[level.id + ':' + k]; return `${DIFFS[k].name}：${b.cleared ? '守過整夜 ✅' : `撐到第 ${b.wave} 波`}`; });
  $('#best').textContent = lines.length ? '最高紀錄 ' + lines.join('　') : '';
}

function toast(msg, tip) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('tip', !!tip);
  clearTimeout(toastTimer);
  if (tip) toastTimer = setTimeout(() => t.classList.remove('tip'), 5000);
}

// ====== 操作 ======
function tapCard(key, el) {
  if (!G || G.over) return;
  const u = UNITS[key];
  if (G.food < u.cost) {
    el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    toast(`糧不夠，${u.name}要 ${u.cost} 糧`); return;
  }
  selected = (selected === key) ? null : key;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('selected', c.dataset.key === selected));
  cells.forEach(c => c.classList.toggle('hint', !!selected && !G.units[c.dataset.r + ',' + c.dataset.c] && !G.rocks.has(c.dataset.r + ',' + c.dataset.c)));
  toast(selected ? (u.kind === 'instant' ? `點狼群中間，${u.name}就打破在那裡` : `點一格草地放下${u.name}`) : '先點一張卡，再點草地放下去');
}
function tapCell(r, c) {
  if (!G || G.over) return;
  if (!selected) { const res = Engine.tapUnit(G, r, c); flushEvents(); if (res.msg) toast(res.msg); return; }
  const res = Engine.place(G, r, c, selected);
  flushEvents();
  if (!res.ok) { toast(res.msg || ''); return; }
  selected = null;
  document.querySelectorAll('.card').forEach(x => x.classList.remove('selected'));
  cells.forEach(x => x.classList.remove('hint'));
  toast(res.msg);
}

// ====== 畫單位 ======
function renderUnit(r, c) {
  const cell = cells[r * COLS + c];
  const u = G.units[r + ',' + c];
  cell.innerHTML = '';
  if (!u) return;
  const def = UNITS[u.type];
  const d = document.createElement('div');
  d.className = 'unit ' + u.type + (u.elder ? ' elder' : '') + (u.fear > 0 ? ' fear' : '');
  const ico = def.kind === 'dog' ? '🦴' : def.ico;
  const bar = def.kind === 'floor' && def.uses ? `<div class="badge">${u.uses}</div>` : (u.maxHp > 1 && def.kind !== 'dog') ? `<div class="hp"><i style="width:${u.hp / u.maxHp * 100}%"></i></div>` : '';
  d.innerHTML = `${ico}${bar}`;
  cell.appendChild(d);
}

// ====== 畫面上的一次性效果 ======
const FX = { blast: '💥', ignite: '🔥', sting: '☠️', flee: '💨', horn: '📯', howl: '嗷！', roar: '吼！', emerge: '💨', vault: '↷', grab: '🐑', splash: '💥', dodge: '閃', bark: '汪！', enrage: '怒！' };
function fx(kind, r, x) {
  if (kind === 'mound') { const d = spawnFx('🕳️', r, x, true); moundEls.set(r + ':' + x, d); return; }
  if (kind === 'emerge') { for (const [k, d] of moundEls) if (k.startsWith(r + ':')) { d.remove(); moundEls.delete(k); } }
  spawnFx(FX[kind] || '✨', r, x);
}
function spawnFx(text, r, x, stay) {
  const d = document.createElement('div'); d.className = 'fx' + (stay ? ' stay' : ''); d.textContent = text;
  d.style.left = (x / COLS * 100) + '%'; d.style.top = (r / ROWS * 100) + '%';
  board.appendChild(d); if (!stay) setTimeout(() => d.remove(), 1100);
  return d;
}
function pop(r, c, text) {
  const d = document.createElement('div'); d.className = 'pop'; d.textContent = text;
  d.style.left = ((c + 0.3) / COLS * 100) + '%'; d.style.top = ((r + 0.2) / ROWS * 100) + '%';
  board.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function setMarker(r, type) {
  if (markerEl) { markerEl.remove(); markerEl = null; }
  if (r === null || r === undefined) return;
  const d = document.createElement('div'); d.className = 'mark';
  d.textContent = (type && type !== 'wolf' && type !== 'fast') ? ENEMIES[type].ico : '🐾';
  d.style.top = (r / ROWS * 100) + '%';
  board.appendChild(d); markerEl = d;
}

// 把引擎這一步發生的事畫出來
function flushEvents() {
  for (const e of G.events) {
    switch (e.t) {
      case 'toast': toast(e.msg); break;
      case 'callout': toast(`${ENEMIES[e.type].ico} ${e.tip}`, true); break;
      case 'pop': pop(e.r, e.c, e.text); break;
      case 'unit': renderUnit(e.r, e.c); break;
      case 'fx': fx(e.kind, e.r, e.x); break;
      case 'marker': setMarker(e.r, e.type); break;
      case 'sheep': $('#sheep-n').textContent = G.sheep; break;
      case 'win': onWin(); break;
      case 'lose': onLose(e.reason); break;
    }
  }
  G.events.length = 0;
}

// ====== 每一幀 ======
function tick(now) {
  raf = requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  Engine.step(G, dt);
  flushEvents();
  draw();
}

function statusText(e) {
  let s = '';
  if (e.st.burn) s += '🔥'; if (e.st.poison) s += '☠️'; if (e.st.slow) s += '🐌'; if (e.st.stun || e.st.distract) s += '💫'; if (e.st.panic) s += '😱'; if (e.st.howl) s += '💨'; if (e.enraged) s += '😡';
  return s;
}
function draw() {
  $('#food').textContent = Math.floor(G.food);
  const t = Math.ceil(G.timer), n = G.waves.length;
  $('#wave-info').textContent =
    G.phase === 'prep' ? `第 1 波 ${t} 秒後來` :
    G.phase === 'rest' ? (G.wave >= n ? '天快亮了' : `第 ${G.wave + 1} 波 ${t} 秒後來`) :
    `第 ${G.wave} / ${n} 波`;

  const alive = new Set();
  for (const e of G.enemies) {
    alive.add(e.id);
    let el = els.get(e.id);
    if (!el) {
      const def = ENEMIES[e.type];
      el = document.createElement('div'); el.className = 'enemy ' + (def.cls || '');
      el.innerHTML = `<div class="body">${def.ico}<div class="st"></div></div><div class="hp"><i style="width:100%"></i></div>`;
      const w = G.waves[G.wave - 1];
      if (w && w.hpMul > 1.2) el.querySelector('.body').style.transform = `scale(${1 + (w.hpMul - 1) * 0.2})`;
      board.appendChild(el); els.set(e.id, el);
    }
    el.style.left = (e.x / COLS * 100) + '%';
    el.style.top = (e.r / ROWS * 100) + '%';
    el.classList.toggle('underground', !!e.underground);
    el.classList.toggle('carry', !!e.carrying);
    el.querySelector('.hp > i').style.width = (Math.max(0, e.hp) / e.maxHp * 100) + '%';
    const st = el.querySelector('.st'); const txt = statusText(e); if (st.textContent !== txt) st.textContent = txt;
  }
  for (const s of G.shots) {
    alive.add(s.id);
    let el = els.get(s.id);
    if (!el) { el = document.createElement('div'); el.className = 'shot ' + s.kind; board.appendChild(el); els.set(s.id, el); }
    el.classList.toggle('burn', !!s.burn);
    const lift = s.kind === 'lob' ? Math.sin(Math.min(1, s.t) * Math.PI) * 0.6 : 0;
    el.style.left = `calc(${s.x / COLS * 100}% - 6px)`;
    el.style.top = `calc(${(s.r + 0.5 - lift) / ROWS * 100}% - 6px)`;
  }
  for (const k in G.units) {
    const u = G.units[k]; if (u.type !== 'dog') continue;
    alive.add(u.id);
    let el = els.get(u.id);
    if (!el) { el = document.createElement('div'); el.className = 'dog-run'; el.innerHTML = `<div class="body">🐕</div><div class="hp"><i style="width:100%"></i></div>`; board.appendChild(el); els.set(u.id, el); }
    el.style.left = (u.x / COLS * 100) + '%'; el.style.top = (u.r / ROWS * 100) + '%';
    el.querySelector('.hp > i').style.width = (Math.max(0, u.hp) / u.maxHp * 100) + '%';
  }
  for (const [id, el] of els) if (!alive.has(id)) { el.remove(); els.delete(id); }

  $('#bar > i').style.width = (G.killed / G.total * 100) + '%';
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('poor', G.food < UNITS[c.dataset.key].cost));
}

// ====== 勝負 ======
function endGame(title, text) {
  $('#result-title').textContent = title;
  $('#result-text').textContent = text;
  $('#psalm').innerHTML = '';
  $('#result').hidden = false;
}
function recordBest(cleared) {
  const k = level.id + ':' + diff;
  const score = cleared ? G.waves.length + 1 : G.wave;
  const old = P.best[k] || {};
  if (!(old.score >= score)) P.best[k] = { score, cleared, wave: G.wave };
  if (cleared) (P.cleared[level.id] = P.cleared[level.id] || {})[diff] = true;
  saveProgress();
}
function onWin() {
  recordBest(true);
  const next = LEVELS.find(l => l.id === level.id + 1);
  endGame('天亮了 🌅', `${DIFFS[diff].name}守過了。${level.outroWin}`);
  $('#next').hidden = !next;
  if (level.psalm) {
    const box = $('#psalm');
    level.psalm.forEach((line, i) => { const d = document.createElement('div'); d.textContent = line; box.appendChild(d); setTimeout(() => d.classList.add('on'), 600 + i * 1500); });
  }
}
function onLose(reason) {
  recordBest(false);
  const titles = { wolf: '狼闖進羊圈了', bird: '鷙鳥飛進羊圈了', sheep: '羊被偷光了' };
  const text = (level.outroLose && (level.outroLose[reason] || level.outroLose.wolf)) || '';
  endGame(titles[reason] || '守夜失敗', `你撐到了第 ${G.wave} 波。${text}`);
  $('#next').hidden = true;
}

// ====== 開始／重來 ======
function clearBoard() {
  cancelAnimationFrame(raf);
  for (const [, el] of els) el.remove(); els.clear();
  board.querySelectorAll('.pop, .fx, .mark').forEach(x => x.remove()); moundEls.clear(); markerEl = null;
  selected = null;
  document.querySelectorAll('.card').forEach(x => x.classList.remove('selected'));
  $('#result').hidden = true;
}
function startGame() {
  clearBoard();
  G = Engine.create(level.id, diff);
  buildCards();
  cells.forEach(c => { c.innerHTML = ''; c.classList.remove('hint'); c.classList.toggle('rock', G.rocks.has(c.dataset.r + ',' + c.dataset.c)); });
  $('#sheep').hidden = !level.sheep; $('#sheep-n').textContent = G.sheep;
  toast('先點一張卡，再點草地放下去');
  draw();
  last = performance.now();
  raf = requestAnimationFrame(tick);
}
function backToLevels() {
  clearBoard();
  if (G) G.over = true;
  buildLevels();
  $('#intro').hidden = true; $('#result').hidden = true; $('#levels').hidden = false;
}

buildBoard(); buildLevels();
try { diff = localStorage.getItem('sheepfold-diff') || 'calm'; } catch (e) {}
if (!DIFFS[diff]) diff = 'calm';
document.querySelectorAll('.diff').forEach(b => b.addEventListener('click', () => applyDiff(b.dataset.key)));
$('#start').addEventListener('click', () => { $('#intro').hidden = true; startGame(); });
$('#intro-back').addEventListener('click', backToLevels);
$('#retry').addEventListener('click', startGame);
$('#back').addEventListener('click', backToLevels);
$('#next').addEventListener('click', () => { const nx = LEVELS.find(l => l.id === level.id + 1); clearBoard(); if (nx) openIntro(nx); else backToLevels(); });
</script>
