<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2a26">
<title>羊圈守夜</title>
<style>
  /* 色票集中在這裡，之後換美術只改這一區 */
  :root {
    --bg: #2b2a26;         /* 夜色底 */
    --panel: #3a3831;      /* 面板 */
    --grass: #4f6b3a;      /* 草地格 */
    --grass2: #5a7a43;     /* 草地格（交錯色） */
    --rock: #5a5650;       /* 石頭格 */
    --line: #2e3d24;
    --text: #f3ead8;
    --muted: #b9b09c;
    --gold: #e6b84a;       /* 糧 */
    --danger: #d9534f;
    --ok: #7bc47f;
    --card: #4a4639;
    --card-on: #6e6447;
    --new: #ffd98a;
    --ease-out: cubic-bezier(.23, 1, .32, 1); /* 進退場共用：先快後慢 */
    /* 我方單位底色：卡片左上角的小色塊與場上色一致 */
    --u-shepherd: #3d6ea8; --u-slinger: #a8553d; --u-sling: #8a3f2e; --u-hireling: #7d7a6a; --u-archer: #6b4e2e;
    --u-wall: #777; --u-tower: #5c5c66; --u-dog: #c9a24a; --u-thorns: #4a7a3a;
    --u-brazier: #6e3a1e; --u-jar: #8a5a2e; --u-horn: #7a6a2a; --u-healer: #3d8a7a; --u-catapult: #5a4a3a;
    --u-staff: #8a6a3a; --u-lamp: #b8862a; --u-patrol: #4a5a7a; --u-volley: #a8553d; --u-cradle: #7a4a6a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; min-height: 100dvh; user-select: none; -webkit-user-select: none; touch-action: manipulation; }

  /* 上方資源列 */
  #top { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--panel); font-size: 15px; }
  #top b { font-size: 18px; }
  #food { color: var(--gold); }
  #sheep[hidden] { display: none; }
  #wave-info { color: var(--muted); }
  #pause-btn, #snd-btn { font: inherit; font-size: 16px; background: var(--card); color: var(--text); border: 1px solid #0006; border-radius: 8px; padding: 2px 9px; margin-left: 8px; cursor: pointer; }
  /* 聲音設定（暫停層）：一列一個選項，右邊是開關或三檔 */
  .snd { text-align: left; margin: 12px 0 4px; }
  .snd-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-top: 1px solid #0004; font-size: 15px; }
  .snd-row:first-child { border-top: 0; }
  .snd-row .seg { display: flex; gap: 4px; }
  .snd-row button { font: inherit; font-size: 14px; background: var(--card); color: var(--text); border: 2px solid transparent; border-radius: 8px; padding: 5px 14px; cursor: pointer; min-width: 52px; }
  .snd-row button.on { border-color: var(--gold); background: var(--card-on); }
  .snd-row.off { opacity: .4; pointer-events: none; } /* 音效關著時，蟲鳴與音量先壓暗 */
  .snd-note { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: left; }
  /* 開場頁右上角的喇叭：第一次進來就看得到，聲音響起前就能關 */
  #levels .dialog { position: relative; }
  .corner { position: absolute; right: 12px; top: 12px; font: inherit; font-size: 18px; background: var(--card); color: var(--text); border: 1px solid #0006; border-radius: 8px; padding: 3px 9px; cursor: pointer; }
  #resume-line { margin-top: 10px; }
  #resume-line[hidden] { display: none; }

  /* 卡片列：自動換行的格子，手機一排 5 張、8 張卡加鏟子剛好兩排，不用左右滑（2026-10-17 James：手機要一直滑很煩）；寬螢幕自然回到一排 */
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; padding: 8px 12px; background: var(--panel); border-top: 1px solid #000; }
  .card { background: var(--card); border: 2px solid transparent; border-radius: 10px; padding: 7px 3px 6px; text-align: center; cursor: pointer; transition: transform 120ms var(--ease-out), opacity 150ms; min-height: 60px; position: relative; }
  /* 分組只靠左上角的小色點與排序；格子會換行，不再畫分隔線 */
  /* 送卡模式：新送到的那張從下面浮上來，其他張不動 */
  .card.arrive { transition: transform 150ms var(--ease-out), opacity 150ms var(--ease-out); }
  @starting-style { .card.arrive { opacity: 0; transform: translateY(6px); } }
  .card .dot { position: absolute; left: 5px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--u, #888); }
  .card .tag { position: absolute; right: 4px; top: 3px; font-size: 10px; color: #2b2a26; background: var(--new); border-radius: 6px; padding: 0 4px; }
  #cards-wrap { background: var(--panel); }
  .card .ico { font-size: 24px; line-height: 1; }
  .card .name { font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .cost { font-size: 11px; color: var(--gold); white-space: nowrap; }
  @media (min-width: 560px) { .card .ico { font-size: 26px; } .card .name, .card .cost { font-size: 12px; } }
  .card.selected { border-color: var(--gold); background: var(--card-on); }
  .card.poor { opacity: .45; }
  .card.shovel { background: #3f3b31; }
  .card.once, .rc.once { border-style: dashed; border-color: #f3ead855; }
  .card.once.selected, .rc.once.on { border-color: var(--gold); }
  .tag.once { background: #f3ead8cc; }
  .new .tag.once { right: 30px; }
  .cell.hint.sell { outline-color: var(--danger); }
  .cell.hint.swap { outline-style: solid; } /* 可直接換掉的單位：金色實線，跟空格的虛線分開 */
  /* 新卡光暈：陰影固定畫在一層假元素上，循環只動它的透明度，不每幀重繪陰影 */
  .card.new::after { content: ''; position: absolute; inset: -2px; border-radius: 10px; box-shadow: 0 0 10px 2px var(--new); pointer-events: none; animation: glowFade 1.4s infinite alternate; }
  @keyframes glowFade { from { opacity: 0; } to { opacity: 1; } }
  /* 教學：沒輪到的卡壓暗、要放的格子亮金框 */
  .card.dim { opacity: .25; pointer-events: none; }
  .cell.teach { outline: 3px solid var(--gold); outline-offset: -5px; }
  .cell.teach::before { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 18px 4px #e6b84a77; pointer-events: none; animation: glowFade .9s infinite alternate; }
  #tut-skip { display: none; margin: 6px auto 0; font: inherit; font-size: 12px; background: transparent; color: var(--muted); border: 1px solid var(--muted); border-radius: 6px; padding: 3px 10px; }
  #tut-skip.on { display: block; }
  /* 按壓回饋：所有可按的東西都縮一點點 */
  .btn, .diff, .tab, .lv, .rc, #pause-btn, #snd-btn, .corner, .snd-row button, #tut-skip { transition: transform 120ms var(--ease-out); }
  .card:active, .btn:not(:disabled):active, .diff:active, .tab:active, .lv:not(.locked):active, .rc:not(.locked):active, #pause-btn:active, #snd-btn:active, .corner:active, .snd-row button:active, #tut-skip:active { transform: scale(.97); }

  /* 棋盤 */
  #board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px; }
  #board { position: relative; width: 100%; max-width: 640px; aspect-ratio: 7 / 5; display: grid;
    grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(5, 1fr); border: 3px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cell { position: relative; background: var(--grass); display: flex; align-items: center; justify-content: center; font-size: clamp(18px, 6vw, 36px); }
  .cell.alt { background: var(--grass2); }
  .cell.rock { background: var(--rock); }
  /* 無月夜：腳印消失那一刻整個棋盤暗一階，右邊出生的那側更暗（看不見牠從哪來） */
  #board { transition: filter 2s; }
  #board.moonless { filter: brightness(.78) saturate(.85); }
  .fog { position: absolute; right: 0; height: calc(100% / 5); width: 22%; background: linear-gradient(90deg, #0000, #0a0c14cc); pointer-events: none; opacity: 0; transition: opacity 2s; z-index: 1; }
  #board.moonless .fog { opacity: 1; }
  /* 油燈照到的排：黑霧散掉、草地轉暖亮（棋盤整體仍是調暗的，這幾排看起來就像被燈照著） */
  #board.moonless .fog.lit { opacity: 0; transition: opacity .6s; }
  .cell { transition: background .6s; }
  #board.moonless .cell.lit { background: #7d8a3f; }
  #board.moonless .cell.lit.alt { background: #8a9847; }
  .cell.rock::after { content: '🪨'; opacity: .7; font-size: .8em; }
  .cell.hint { outline: 2px dashed var(--gold); outline-offset: -4px; }
  .cell .unit { position: relative; display: flex; align-items: center; justify-content: center; width: 80%; height: 80%; border-radius: 8px; }
  .unit { background: var(--u, #888); }
  .unit.shepherd.elder { filter: brightness(.85); box-shadow: inset 0 0 0 2px var(--gold); }
  .unit.dog      { background: transparent; opacity: .35; font-size: .6em; }
  .unit.thorns { background: #f3ead822; border: 2px dashed #f3ead866; border-radius: 50%; }
  .unit.thorns.upgraded { border-color: #c9d46a; }
  .unit.healer.upgraded, .unit.horn.upgraded { box-shadow: inset 0 0 0 2px var(--gold); }
  .unit.lamp { box-shadow: 0 0 14px 4px #ffd98a66; }        /* 油燈：暖光暈，無月夜裡一眼看到誰照著 */
  .unit.staff { background: transparent; border: 2px solid #c9a24a99; }
  .unit.patrol { background: transparent; opacity: .35; font-size: .6em; } /* 跟狗窩一樣：格子只留個記號，人在外面走 */
  .unit.cradle { background: var(--u-cradle); }
  .unit .hp.thick { height: 5px; }
  .unit .cd { position: absolute; left: 10%; right: 10%; bottom: 7px; height: 3px; background: #0006; }  /* 吹角手冷卻條，疊在血條上方 */
  .unit .cd > i { display: block; height: 100%; width: 100%; background: var(--gold); transform-origin: left; opacity: .85; }
  .unit.ready .cd > i { opacity: 1; box-shadow: 0 0 6px 1px var(--gold); }  /* 蓄力完成：金條發亮，隨時會吹 */
  .unit .hp, .enemy .hp, .dog-run .hp { position: absolute; left: 10%; right: 10%; bottom: 2px; height: 3px; background: #0006; }
  .hp > i { display: block; height: 100%; width: 100%; background: var(--ok); transform-origin: left; }  /* 血量用 scaleX 畫，不動寬度 */
  .unit.fear { filter: grayscale(.8); }
  .unit .badge { position: absolute; top: -4px; right: -4px; font-size: 11px; background: #000a; border-radius: 8px; padding: 0 4px; }
  /* 可以升級／修補的提示角標：糧夠了才出現 */
  .unit .up { position: absolute; top: -7px; left: -7px; font-size: 10px; line-height: 1.4; background: var(--gold); color: #2b2a26; border-radius: 8px; padding: 0 4px; white-space: nowrap; animation: bob .7s 4 alternate; }
  @keyframes bob { to { transform: translateY(-3px); } }

  /* 敵人、狗、石頭用絕對定位；會動的東西位置走 transform（百分比以自己一格的大小為準），不每幀改 left/top */
  .enemy, .dog-run, .shot { left: 0; top: 0; will-change: transform; }
  .enemy, .dog-run { transition: opacity .2s; }
  .enemy, .dog-run, .mark { position: absolute; width: calc(100% / 7); height: calc(100% / 5); display: flex; align-items: center; justify-content: center; font-size: clamp(18px, 6vw, 36px); pointer-events: none; }
  /* 敵人辨識規則：所有敵人暗紅細圈（陣營）；大小＝威脅；金色粗圈＝頭目；形狀圓＝獸、方圓＝人；底色只做輔助 */
  .enemy .body { --k: 1; width: 70%; height: 70%; border-radius: 50%; background: #5b5b66; display: flex; align-items: center; justify-content: center; position: relative;
    box-shadow: 0 0 0 1.5px #8a2f2c; transform: scale(calc(var(--k) * var(--hs, 1))); transition: box-shadow .2s, filter .2s, transform 200ms var(--ease-out); }
  .enemy.fast .body { --k: .8; }
  .enemy.fast .body::before { content: ''; position: absolute; left: 90%; top: 45%; width: 70%; height: 3px; background: linear-gradient(90deg, #f3ead8aa, #f3ead800); }
  .enemy.alpha .body { --k: 1.2; box-shadow: 0 0 0 3px var(--gold); }
  .enemy.big .body { --k: 1.3; background: #5a3f2a; }
  .enemy.lion .body { --k: 1.4; box-shadow: 0 0 0 3px var(--gold); }
  .enemy.human .body { background: #3a3a30; border-radius: 30%; transform: scale(calc(var(--k) * var(--hs, 1))) rotate(-6deg); }
  .enemy.light .body { background: #a89a7a; }
  .enemy.small .body { width: 50%; height: 50%; background: #b8682a; }
  .enemy.swarm .body { width: 45%; height: 45%; background: #5f7a34; box-shadow: none; }
  .enemy.dig .body { background: linear-gradient(180deg, #a8843a 55%, #5a4a2a 56%); overflow: hidden; }
  /* 第二章 */
  .enemy.sly .body { background: #6b5a3a; }                                   /* 豺狼：毛色偏黃，跟灰狼分得開 */
  .enemy.boar .body { --k: 1.25; background: #4a3426; border-radius: 42%; }   /* 野豬：方一點 */
  .enemy.owl .body { background: transparent; box-shadow: none; }
  .enemy.leopard .body { --k: 1.35; background: #a8862a; box-shadow: 0 0 0 3px var(--gold); }
  .enemy.s-crouch .body { transform: scale(calc(var(--k) * var(--hs, 1) * .8)) translateY(12%); filter: brightness(.7); } /* 蹲伏：壓低、變暗，預兆 */
  .enemy.s-dash .body { filter: brightness(1.25); }
  /* 巡夜人與迷羊：跟狗一樣是會動的，絕對定位走 transform */
  .patrol-run .body { width: 70%; height: 70%; border-radius: 8px; background: var(--u-patrol); display: flex; align-items: center; justify-content: center; position: relative; }
  .stray .body { width: 60%; height: 60%; border-radius: 50%; background: #f3ead8; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #e6b84a; }
  .enemy.underground { opacity: 0; }
  .enemy.fly { align-items: flex-start; }
  .enemy.fly .body { background: transparent; box-shadow: none; }
  .enemy.fly::after { content: ''; position: absolute; bottom: 8%; left: 30%; width: 40%; height: 6px; border-radius: 50%; background: #0005; }
  .enemy.carry .body::after { content: '🐑'; position: absolute; right: -10px; bottom: -6px; font-size: .7em; }
  .enemy .hp > i { background: var(--danger); }
  .enemy.alpha .hp, .enemy.big .hp { height: 5px; }
  .enemy .st { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: .45em; line-height: 1; white-space: nowrap; }
  .enemy.s-burn .body { box-shadow: 0 0 10px 3px #ff8a3d; }
  .enemy.s-poison .body { filter: sepia(.4) hue-rotate(60deg) saturate(1.6); }
  .enemy.s-stun { opacity: .6; }
  .enemy.s-dodge .body { animation: dodge .35s; }
  @keyframes dodge { 30% { transform: translateX(40%) scale(calc(var(--k) * var(--hs, 1))); opacity: .4; } }
  /* 嚎叫／咆哮：向外擴散的波紋，不飄字 */
  .ripple { position: absolute; width: calc(100% / 7); height: calc(100% / 5); pointer-events: none; }
  .ripple::before, .ripple::after { content: ''; position: absolute; inset: 15%; border-radius: 50%; border: 2px solid var(--ripple, #f3ead8); animation: ripple 1s ease-out forwards; }
  .ripple::after { animation-delay: .25s; }
  @keyframes ripple { to { transform: scale(2.6); opacity: 0; } }
  .dog-run .body { width: 70%; height: 70%; border-radius: 50%; background: #c9a24a; display: flex; align-items: center; justify-content: center; position: relative; }
  .dog-run.rest { opacity: .55; }
  .dog-run.rest .body::after { content: '💤'; position: absolute; top: -8px; right: -6px; font-size: .5em; }
  .mark { right: 2px; font-size: clamp(14px, 4.5vw, 26px); opacity: .85; animation: blink .8s infinite alternate; }
  .mark.special span { display: flex; align-items: center; justify-content: center; width: 72%; height: 72%; border-radius: 50%; box-shadow: 0 0 0 2px #8a2f2c, 0 0 10px 2px #8a2f2c88; }
  .mark.boss span { box-shadow: 0 0 0 3px var(--gold), 0 0 12px 3px #e6b84a88; }
  @keyframes blink { from { opacity: .35; } to { opacity: .95; } }
  .shot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #e9e4d0; pointer-events: none; }
  .shot.arrow { width: 18px; height: 3px; border-radius: 2px; background: #d8c8a0; }
  .shot.sling { width: 14px; height: 14px; background: #d0d0d0; }
  .shot.lob { width: 14px; height: 14px; background: #a9a9a9; }
  .shot.burn { background: #ff8a3d; box-shadow: 0 0 6px #ff8a3d; }
  .pop { position: absolute; color: var(--gold); font-weight: bold; font-size: 14px; pointer-events: none; animation: pop 1s var(--ease-out) forwards; }
  .fx { position: absolute; width: calc(100% / 7); height: calc(100% / 5); display: flex; align-items: center; justify-content: center; font-size: clamp(16px, 5vw, 30px); pointer-events: none; animation: popLight .8s var(--ease-out) forwards; }
  @keyframes popLight { to { transform: translateY(-12px); opacity: 0; } }
  .fx.stay { animation: blink .6s infinite alternate; }
  @keyframes pop { to { transform: translateY(-24px); opacity: 0; } }

  /* 開發者模式列 */
  #dev { display: none; flex-wrap: wrap; gap: 6px; padding: 6px 12px; background: #1f1e1a; border-top: 1px solid #000; font-size: 12px; align-items: center; }
  #dev.on { display: flex; }
  #dev button, #dev select { font: inherit; font-size: 12px; background: var(--card); color: var(--text); border: 1px solid #0006; border-radius: 6px; padding: 4px 8px; }
  #dev button.on { background: var(--gold); color: #2b2a26; }
  #dev .lab { color: var(--muted); }

  /* 底部進度條 */
  #bottom { padding: 8px 12px 14px; background: var(--panel); }
  #bar { height: 8px; background: #0006; border-radius: 4px; overflow: hidden; }
  #bar > i { display: block; height: 100%; width: 100%; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease-out); }
  #toast { text-align: center; font-size: 13px; color: var(--muted); min-height: 18px; margin-top: 6px; }
  #toast.tip { color: var(--new); }

  /* 蓋在上面的對話／結果畫面 */
  .overlay { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; overflow-y: auto; }
  .overlay[hidden] { display: none; }
  /* 對話框進場：先小一點點再浮出；暫停是系統反應，不給動畫 */
  .dialog { transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
  @starting-style { .overlay:not([hidden]) .dialog { opacity: 0; transform: scale(.97); } }
  #pause .dialog { transition: none; }
  /* 暫停時棋盤上的循環動畫也停 */
  #board.paused, #board.paused * { animation-play-state: paused; }
  .dialog { background: var(--panel); border-radius: 14px; padding: 22px 20px; max-width: 420px; width: 100%; text-align: center; margin: auto; }
  .dialog h1 { margin: 0 0 6px; font-size: 24px; }
  .dialog .ref { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .dialog p { line-height: 1.7; font-size: 15px; text-align: left; }
  .dialog .who { color: var(--gold); }
  .dialog .verse { background: #0004; border-left: 3px solid var(--gold); padding: 8px 10px; border-radius: 4px; }
  #diffs { display: flex; gap: 6px; margin: 10px 0 4px; }
  .diff { flex: 1; background: var(--card); color: var(--text); border: 2px solid transparent; border-radius: 10px; padding: 9px 0; font-size: 15px; font-family: inherit; cursor: pointer; }
  .diff.selected { border-color: var(--gold); background: var(--card-on); }
  #diff-hint { font-size: 12px; color: var(--muted); min-height: 16px; margin-bottom: 8px; }
  .btn.alt { background: transparent; color: var(--muted); border: 1px solid var(--muted); margin-top: 8px; }
  .btn { display: inline-block; margin-top: 12px; padding: 12px 28px; font-size: 17px; border-radius: 10px; border: 0; background: var(--gold); color: #2b2a26; font-weight: bold; cursor: pointer; font-family: inherit; }
  .btn[hidden] { display: none; }
  .btn:disabled { opacity: .4; cursor: default; }
  .tips { font-size: 13px; color: var(--muted); text-align: left; margin-top: 10px; line-height: 1.6; }
  /* 今晚有新夥伴：先引去圖鑑看一眼再開打（只提醒一次） */

  /* 首頁：一次只看一章，七夜塞進一屏不用捲（2026-10-17 James：選關要往下拉、圖鑑太下面） */
  .dialog.home { padding: 18px 16px 14px; }

  .lv .n { font-size: 17px; width: 24px; text-align: center; color: var(--gold); }

  .lv .t b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lv .t span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .lv .s { font-size: 12px; color: var(--ok); white-space: nowrap; }
  .upd { margin-top: 10px; font-size: 11px; color: var(--muted); }
  #psalm { text-align: left; font-size: 15px; line-height: 1.9; margin-top: 10px; }
  #psalm div { opacity: 0; transition: opacity 1.2s; }
  #psalm div.on { opacity: 1; }

  /* 點兵與圖鑑 */
  .dialog.roster { max-width: 460px; }
  .tabs { display: flex; gap: 6px; margin: 8px 0 10px; }
  .tab { flex: 1; background: var(--card); color: var(--text); border: 2px solid transparent; border-radius: 10px; padding: 8px 0; font-size: 15px; font-family: inherit; cursor: pointer; }
  .tab.selected { border-color: var(--gold); background: var(--card-on); }
  #roster-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 40vh; overflow-y: auto; padding: 2px; }

  .rc .dot { position: absolute; left: 5px; top: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--u, #888); }
  .rc .tag { position: absolute; right: 4px; top: 3px; font-size: 10px; color: #2b2a26; background: var(--new); border-radius: 6px; padding: 0 4px; }
  .rc .ico { font-size: 26px; line-height: 1; }
  .rc .name { font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc .cost { font-size: 11px; color: var(--gold); }
  .rc.on { border-color: var(--gold); background: var(--card-on); }
  .rc.off { opacity: .45; }
  .rc.locked { opacity: .35; cursor: default; }
  .rc.focus { outline: 2px solid var(--text); outline-offset: 1px; }
  .rc.on::after { content: '✓'; position: absolute; right: 4px; bottom: 2px; font-size: 11px; color: var(--gold); }
  #roster-count { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }
  #roster-detail { text-align: left; background: #0004; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 14px; line-height: 1.6; height: 122px; overflow-y: auto; }
  #roster-detail b { color: var(--gold); }
  #roster-detail .ref { margin: 0; }
  #roster-detail .num { color: var(--muted); font-size: 12px; }
  #roster-detail .new { color: var(--new); font-size: 13px; }

  /* 減少動態：留透明度變化，拿掉位移與閃爍 */
  @media (prefers-reduced-motion: reduce) {
    .card.new::after, .cell.teach::before, .mark, .fx.stay, .unit .up { animation: none; }
    .card.new::after, .cell.teach::before { opacity: .8; }
    .pop, .fx { animation-name: fadeOut; animation-duration: .5s; }
    .dialog { transition: opacity 200ms; }
    .card:active, .btn:active, .diff:active, .tab:active, .lv:active, .rc:active, #pause-btn:active, #snd-btn:active, .corner:active, .snd-row button:active, #tut-skip:active { transform: none; }
  }

</head>
<body>

<!-- 開場 -->

<div class="overlay" id="roster" hidden>

<div class="overlay" id="pause" hidden>

</div>

<!-- 結果 -->
<div class="overlay" id="result" hidden>
  <div class="dialog">
    <h1 id="result-title"></h1>
    <p id="result-text"></p>
    <div id="psalm"></div>
    <button class="btn" id="next" hidden>下一夜</button>
    <button class="btn" id="retry">再守一夜</button>
    <button class="btn alt" id="back">回關卡</button>
  </div>
</div>

<script src="data.js?v=8"></script>
<script src="engine.js?v=9"></script>
<script src="sound.js?v=7"></script>
<script>
'use strict';
// ROWS、COLS、UNITS、ENEMIES、STRAY、DIFFS、LEVELS 由 data.js 直接提供
const $ = s => document.querySelector(s);
const setText = (el, s) => { if (el.textContent !== s) el.textContent = s; }; // 字沒變就不重寫，省排版
// 糧不足搖一下：用 Web Animations 重播，不用強迫排版的老招
const SHAKE = [{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)', offset: .25 }, { transform: 'translateX(5px)', offset: .75 }, { transform: 'translateX(0)' }];
function shake(el) { if (el.animate) el.animate(SHAKE, 300); }
document.addEventListener('touchstart', () => {}, { passive: true }); // iOS 要有這個 :active 才會亮
const board = $('#board');
const boardSize = { w: 0, h: 0 }; // 棋盤大小變了才量一次，畫投射物時直接用，不每幀量
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => { boardSize.w = board.clientWidth; boardSize.h = board.clientHeight; }).observe(board);
const cells = [], fogEls = [], litRows = [false, false, false, false, false];
let G = null, level = LEVELS[0], diff = 'calm', selected = null, last = 0, raf = 0;
const els = new Map();   // 引擎物件 id → 畫面元素
let markerEl = null, moundEls = new Map();
let toastTimer = 0;
let cardEls = [], lastFood = -1, lastHand = 0, lastUnits = -1;
// 開發者模式：網址加 ?dev，或連點左上角「糧」五下
let devOn = /[?&]dev/.test(location.search), speed = 1, paused = false, devEnemy = '', foodTaps = 0;
let devUsed = false;   // 這一局有沒有開過開發者面板；開過就不存檔，免得作弊狀態被續玩帶走
let pendingCp = null;  // 續玩前要先點兵時，先把存檔記著
const CP_BROKEN = '上次的存檔讀不出來，這一夜要從頭守。';

// ====== 進度（只存在這支手機） ======
const PKEY = 'sheepfold-progress-v3';
function loadProgress() {
  let p = { cleared: {}, best: {} };
  try { p = Object.assign(p, JSON.parse(localStorage.getItem(PKEY) || '{}')); } catch (e) {}
  // 舊版只有第一關的紀錄，搬過來
  try {
    const old = JSON.parse(localStorage.getItem('sheepfold-best-v2') || 'null');
    if (old && !p.migrated) { for (const k in old) { p.best['1:' + k] = old[k]; if (old[k].cleared) (p.cleared[1] = p.cleared[1] || {})[k] = true; } p.migrated = true; saveProgress(p); }
  } catch (e) {}
  return p;
}
let P = loadProgress();
function saveProgress(p) { try { localStorage.setItem(PKEY, JSON.stringify(p || P)); } catch (e) {} }
const unlockAll = /[?&]all/.test(location.search);
function unlocked(id) { return unlockAll || Engine.isUnlocked(P.cleared, id); } // 規則在引擎（可測）：本夜／前一夜／任一後夜守過即開
// 所有已開放關卡的卡總和（圖鑑用；也用來判斷玩家手上有沒有這一夜帶不了的卡）
function unlockedUnits() { const all = []; for (const l of LEVELS) if (unlocked(l.id)) for (const k of l.units) if (!all.includes(k)) all.push(k); return all; }

const CHAPTER_NAMES = { 1: '守夜', 2: '另外的羊' };
const CHAPTERS = { 1: '七夜，學會牧人、射手、牆、狗，最後一夜兩隻獅子', 2: '沒有月亮看不到腳印，敵人會換排；山上還有別人家的羊要帶回來' };
const HOME_UPDATE = '最近更新 10/17：第二章七夜上線、加了音效（右上角 🔊）、卡片改兩排不用滑';

// ====== 畫面建立 ======
function buildBoard() {
  board.innerHTML = ''; cells.length = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const d = document.createElement('div');
    d.className = 'cell' + ((r + c) % 2 ? ' alt' : '');
    d.dataset.r = r; d.dataset.c = c;
    d.addEventListener('click', () => tapCell(r, c));
    board.appendChild(d); cells.push(d);
  }
  // 無月夜的黑霧一排一個，油燈照到的排才能單獨散掉
  fogEls.length = 0;
  for (let r = 0; r < ROWS; r++) { const f = document.createElement('div'); f.className = 'fog'; f.style.top = (r / ROWS * 100) + '%'; board.appendChild(f); fogEls.push(f); }
}
function buildCards() {
  const wrap = $('#cards'); wrap.innerHTML = '';
  const L = G ? G.level : level; // 開發者「全卡」會換掉這一局的 level
  const conveyor = !!(G && G.level.conveyor);
  // 固定分組：產糧｜射手（含狗）｜牆｜鋪地｜一次性／輔助；組首留空隙。送卡模式：手上有什麼列什麼，照送到的順序
  const keys = conveyor ? G.hand.slice() : sortUnits(L.units);
  const grew = conveyor && keys.length > lastHand; lastHand = conveyor ? keys.length : 0; // 手上變多＝最後一張是剛送到的
  let lastG = -1;
  keys.forEach((key, i) => {
    const u = UNITS[key], g = conveyor ? -1 : GROUP[u.kind];
    const d = document.createElement('div');
    const fresh = L.fresh.includes(key) && !seenCard(key);
    d.className = 'card' + (fresh ? ' new' : '') + (u.kind === 'instant' ? ' once' : '') + (g !== lastG && lastG >= 0 ? ' group-start' : '') + (key === selected ? ' selected' : '') + (grew && i === keys.length - 1 ? ' arrive' : ''); d.dataset.key = key;
    d.style.setProperty('--u', `var(--u-${key})`);
    d.innerHTML = `<div class="dot"></div>${fresh ? '<div class="tag fresh">新</div>' : ''}${u.kind === 'instant' ? '<div class="tag once">一次</div>' : ''}<div class="ico">${u.ico}</div><div class="name">${u.name}</div><div class="cost">${conveyor ? '送來的' : `🌾 ${u.cost}`}</div>`;
    d.addEventListener('click', () => tapCard(key, d));
    wrap.appendChild(d); lastG = g;
  });
  // 鏟子固定在最後，不佔點兵名額：點它再點單位就拆掉
  const sh = document.createElement('div');
  sh.className = 'card shovel' + (selected === 'shovel' ? ' selected' : ''); sh.dataset.key = 'shovel';
  sh.innerHTML = `<div class="ico">⛏️</div><div class="name">鏟子</div><div class="cost">${conveyor ? '退回手上' : '退一半'}</div>`;
  sh.addEventListener('click', () => tapShovel());
  wrap.appendChild(sh);
  cardEls = [...wrap.querySelectorAll('.card')].filter(c => UNITS[c.dataset.key]); lastFood = -1;
}
// 下一個還沒守過的夜（已開放但沒通過任一難度）；全守完就回 null
function nextLevel() { return LEVELS.find(L => unlocked(L.id) && !P.cleared[L.id]) || null; }
const chapterOf = L => L.chapter || 1;
let homeChapter = 0; // 首頁停在哪一章；0＝自動（進度所在的章）
function buildLevels() {
  const chapters = [...new Set(LEVELS.map(chapterOf))];
  const nx = nextLevel();
  const cur = chapters.includes(homeChapter) ? homeChapter : chapterOf(nx || LEVELS[LEVELS.length - 1]);
  // 接著守：一指跳到下一夜
  const cb = $('#continue-btn'); cb.hidden = !nx;
  if (nx) { cb.textContent = `接著守：第 ${Engine.posOf(nx.id)} 夜 ${nx.name}`; cb.onclick = () => openIntro(nx); }
  // 章節頁籤：第一夜還沒開的章壓暗
  const tabs = $('#ch-tabs'); tabs.innerHTML = '';
  for (const c of chapters) {
    const first = LEVELS.find(L => chapterOf(L) === c), ok = unlocked(first.id);
    const b = document.createElement('button'); b.className = 'tab' + (c === cur ? ' selected' : '') + (ok ? '' : ' locked');
    b.textContent = `第${['', '一', '二', '三', '四'][c] || c}章 ${CHAPTER_NAMES[c] || ''}`;
    b.addEventListener('click', () => { homeChapter = c; buildLevels(); });
    tabs.appendChild(b);
  }
  $('#ch-sub').textContent = unlocked(LEVELS.find(L => chapterOf(L) === cur).id) ? (CHAPTERS[cur] || '') : '守過上一章最後一夜就會開';
  const list = $('#lv-list'); list.innerHTML = '';
  for (const L of LEVELS) {
    if (chapterOf(L) !== cur) continue;
    const ok = unlocked(L.id);
    const d = document.createElement('div');
    d.className = 'lv' + (ok ? '' : ' locked') + (nx && nx.id === L.id ? ' next' : '');
    const done = P.cleared[L.id] ? Object.keys(P.cleared[L.id]).map(k => DIFFS[k].name.slice(0, 2)).join('・') + ' ✅' : '';
    d.innerHTML = `<div class="n">${ok ? Engine.posOf(L.id) : '🔒'}</div><div class="t"><b>${L.name}</b><span>${ok ? L.ref.replace('取材：', '') : '守過上一夜就會開'}</span></div><div class="s">${done}</div>`;
    if (ok) d.addEventListener('click', () => openIntro(L));
    list.appendChild(d);
  }
  $('#home-upd').textContent = HOME_UPDATE;
}
function openIntro(L) {
  level = L;
  $('#intro-title').textContent = L.title;
  $('#intro-ref').textContent = L.ref;
  const t = $('#intro-text');
  t.innerHTML = L.speaker ? `<span class="who">${L.speaker}：</span>${L.intro}` : `<div class="verse">${L.intro}</div>`;
  $('#intro-tips').innerHTML = L.fresh.map(k => `<div class="new">${UNITS[k].ico} ${UNITS[k].name}：${UNITS[k].desc}</div>`).join('') + (L.tips || []).map(x => `<div>${x}</div>`).join('');
  showIntroNew(L);
  applyDiff(savedDiff()); // 回開場頁一律用平常的預設難度（續玩那一局可能臨時換過）
  showBest();
  const lo = pickedFor(L);
  const extra = unlockedUnits().length - L.units.length; // 玩家手上比這一夜多出幾張卡
  $('#intro-loadout').innerHTML = L.conveyor
    ? `今晚可能送來：${L.units.map(k => UNITS[k].ico).join(' ')}　<span class="new">沒有糧也沒有牧人，卡片定時送到手上，送來什麼就用什麼</span>`
    : lo
    ? `今晚上場：${lo.map(k => UNITS[k].ico).join(' ')}　<span class="new">${L.units.length} 張卡只能帶 ${MAX_CARDS} 張，點「隊伍」可換</span>`
    : `今晚上場：${L.units.map(k => UNITS[k].ico).join(' ')}${extra > 0 ? `　<span class="new">這一夜只有這 ${L.units.length} 位，後來認識的夥伴要到後面的夜才會同行，不能帶回來</span>` : ''}`;
  $('#intro-roster').textContent = lo ? '隊伍' : '圖鑑';
  const cp = loadCheckpoint(L.id), mine = !!cp, hasCp = mine && Engine.checkSnapshot(cp, L.id);
  if (mine && !hasCp) clearCheckpoint(L.id); // 壞掉或舊版的存檔：清掉，並告訴玩家
  $('#resume-line').hidden = !mine; $('#resume-cp').hidden = !hasCp;
  if (mine) $('#resume-text').textContent = hasCp ? `上次${DIFFS[cp.diff].name}守到第 ${cp.wave} 波，場上的人都還在。` : CP_BROKEN;
  $('#start').textContent = hasCp ? '重新開始' : '開始守夜';
  $('#levels').hidden = true; $('#intro').hidden = false;
}
// 這一夜新開的卡、或舊卡在這一夜學會的新招（升級 from＝這一夜），第一次來先引去圖鑑看
const NKEY = 'sheepfold-intro-seen';
function introSeen() { try { return JSON.parse(localStorage.getItem(NKEY) || '[]'); } catch (e) { return []; } }
function newThisNight(L) {

  const upg = L.units.filter(k => UNITS[k].upgrade && UNITS[k].upgrade.from === Engine.posOf(L.id) && !L.fresh.includes(k) && !seen.includes(`${L.id}:${k}`));

function savedDiff() { try { const k = localStorage.getItem('sheepfold-diff'); return DIFFS[k] ? k : diff; } catch (e) { return diff; } }

// 新卡閃光只到玩家第一次點選那張卡為止
function seenCard(key) { try { return (JSON.parse(localStorage.getItem('sheepfold-seen-cards') || '[]')).includes(key); } catch (e) { return false; } }
function markSeen(key) { try { const a = JSON.parse(localStorage.getItem('sheepfold-seen-cards') || '[]'); if (!a.includes(key)) { a.push(key); localStorage.setItem('sheepfold-seen-cards', JSON.stringify(a)); } } catch (e) {} }

// 敵人第一次出現的弱點提示只跳一次，之後不再打擾
function seenEnemy(t) { try { return (JSON.parse(localStorage.getItem('sheepfold-seen-enemies') || '[]')).includes(t); } catch (e) { return false; } }
function markSeenEnemy(t) { try { const a = JSON.parse(localStorage.getItem('sheepfold-seen-enemies') || '[]'); if (!a.includes(t)) { a.push(t); localStorage.setItem('sheepfold-seen-enemies', JSON.stringify(a)); } } catch (e) {} }

function toast(msg, tip) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('tip', !!tip);
  clearTimeout(toastTimer);
  if (tip) toastTimer = setTimeout(() => t.classList.remove('tip'), 5000);
}

// ====== 操作 ======
function tapCard(key, el) {
  if (!G || G.over) return;
  if (tut.on && (tut.waiting || key !== TUT_STEPS[tut.step].card)) { toast(tut.waiting ? TUT_STEPS[tut.step].wait : TUT_STEPS[tut.step].say, true); return; }
  const u = UNITS[key];
  if (!Engine.canAfford(G, key)) {
    shake(el);
    toast(G.level.conveyor ? `${u.name}還沒送到` : `糧不足，${u.name}要 ${u.cost} 糧`); return;
  }
  selected = (selected === key) ? null : key;
  if (el.classList.contains('new')) { el.classList.remove('new'); const t = el.querySelector('.tag.fresh'); if (t) t.remove(); markSeen(key); }
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('selected', c.dataset.key === selected));
  const swappable = markHints();
  // 同類更貴的卡：點原單位直接換掉，實付＝全價－退一半（跟鏟子一樣）
  toast(selected ? (u.kind === 'instant' ? `點敵人密集處，${u.name}就打破在那裡，範圍傷害並嚇退` : swappable ? `點一格草地放下${u.name}；點亮金框的${UNITS[selected].kind === 'blocker' ? '牆' : '投手'}可直接換成${u.name}，退一半糧` : `點一格草地放下${u.name}`) : '先點一張卡，再點草地放下去');
}
function tapShovel() {
  if (!G || G.over || tut.on) return;
  selected = (selected === 'shovel') ? null : 'shovel';
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('selected', c.dataset.key === selected));
  markHints();
  toast(selected ? (G.level.conveyor ? '點一個單位拆掉，沒被咬過的退回手上' : '點一個單位拆掉，退一半糧') : '先點一張卡，再點草地放下去');
}
// 依目前拿的卡把格子亮起來：空地虛線、可直接換的單位金實線、鏟子時有單位的格。場上單位數一變（死了、放了）draw 會再叫一次，免得亮著的格子已經空了
function markHints() {
  let swappable = 0;
  cells.forEach(c => {
    const r = +c.dataset.r, col = +c.dataset.c, k = r + ',' + col;
    if (selected === 'shovel') { const on = !!G.units[k]; c.classList.remove('swap'); c.classList.toggle('sell', on); c.classList.toggle('hint', on); return; }
    const sw = !!selected && !tut.on && Engine.canSwap(G, r, col, selected); if (sw) swappable++;
    c.classList.remove('sell'); c.classList.toggle('swap', sw);
    c.classList.toggle('hint', sw || (!!selected && !G.units[k] && !G.rocks.has(k)));
  });
  return swappable;
}
function clearSelection() {
  selected = null;
  document.querySelectorAll('.card').forEach(x => x.classList.remove('selected'));
  cells.forEach(x => x.classList.remove('hint', 'sell', 'swap'));
}
function tapCell(r, c) {
  if (!G || G.over) return;
  if (devOn && devEnemy) { if (devEnemy === 'stray') Engine.dev.stray(G, r, c); else Engine.dev.spawn(G, devEnemy, r, c); flushEvents(); draw(); return; }
  if (selected === 'shovel') { const res = Engine.sell(G, r, c); flushEvents(); if (res.ok) clearSelection(); toast(res.msg || ''); return; }
  if (!selected) { if (tut.on) { toast(tut.waiting ? TUT_STEPS[tut.step].wait : TUT_STEPS[tut.step].say, true); return; } const res = Engine.tapUnit(G, r, c); flushEvents(); if (res.msg) toast(res.msg); return; }
  if (tut.on) { const [tr, tc] = TUT_STEPS[tut.step].cell; if (r !== tr || c !== tc) { toast('放在亮著的那一格', true); return; } }
  // 格子有人就走「直接換」（同類更貴才會成功，其餘回原因）；沒人才是放下
  const res = G.units[r + ',' + c] ? Engine.swap(G, r, c, selected) : Engine.place(G, r, c, selected);
  flushEvents();
  if (!res.ok) { toast(res.msg || ''); return; }
  if (UNITS[selected].kind !== 'instant') Sound.play('place'); // 瓦瓶的聲音走 fx blast
  clearSelection();
  if (tut.on) { tutAdvance(); return; }
  toast(res.msg);
}

// ====== 畫單位 ======
function renderUnit(r, c) {
  const cell = cells[r * COLS + c];
  const u = G.units[r + ',' + c];
  cell.innerHTML = '';
  if (!u) return;
  const def = UNITS[u.type];
  const d = document.createElement('div');
  d.className = 'unit ' + u.type + (u.elder ? ' elder' : '') + (u.upgraded ? ' upgraded' : '') + (u.fear > 0 ? ' fear' : '');
  d.style.setProperty('--u', `var(--u-${u.type})`);
  const ico = def.kind === 'dog' ? '🦴' : def.kind === 'patrol' ? '🪵' : def.ico; // 狗窩、巡夜人的崗位：人在外面走
  const sting = u.upgraded && def.upgrade && def.upgrade.ico ? `<div class="badge">${def.upgrade.ico}</div>` : ''; // 升級角標：荊棘 🦂、纏裹的牧人 🫗
  const bar = sting + ((u.maxHp > 1 && def.kind !== 'dog') ? `<div class="hp"><i style="transform:scaleX(${(u.hp / u.maxHp).toFixed(3)})"></i></div>` : '');
  const cd = def.push ? '<div class="cd"><i></i></div>' : ''; // 吹角手／銀號：冷卻條（每幀在 render 裡更新，滿了就是隨時會吹）
  d.innerHTML = `${ico}${cd}${bar}`;
  cell.appendChild(d);
}

// ====== 畫面上的一次性效果 ======
const FX = { blast: '💥', ignite: '🔥', sting: '☠️', flee: '💨', horn: '📯', emerge: '💨', grab: '🐑', splash: '💥', enrage: '😡', rest: '💤', slam: '💥', trample: '💨', home: '💛', strike: '✦', crouch: '👁' };
// 引擎事件對應的音效（名稱在 sound.js）；沒列的就沒聲音
const FX_SFX = { blast: 'blast', ignite: 'ignite', horn: 'horn', emerge: 'emerge', grab: 'grab', splash: 'hit', enrage: 'growl', rest: 'whine', howl: 'howl', roar: 'roar', flee: 'whine', slam: 'boar', crouch: 'growl', home: 'sheep', strike: 'hit' };
const SPAWN_SFX = { owl: 'owl', leopard: 'growl' }; // 出生就叫的敵人：無月夜看不到，先聽到
function fx(kind, r, x, id) {
  if (kind === 'mound') { const d = spawnFx('🕳️', r, x, true); moundEls.set(id, d); return; }
  if (kind === 'emerge') { const d = moundEls.get(id); if (d) { d.remove(); moundEls.delete(id); } }
  if (kind === 'howl' || kind === 'roar') { ripple(r, x, kind === 'roar' ? 'var(--gold)' : '#c9a0dc'); return; }
  if (kind === 'bark') return;                      // 狗咬住狼已經看得到，不飄字
  if (kind === 'dodge') { flashDodge(r, x); return; } // 狐狸閃避：殘影，不飄字
  if (kind === 'hop') return;                       // 換排：敵人本身會滑過去，不飄字
  if (FX[kind]) spawnFx(FX[kind], r, x);
}
function ripple(r, x, color) {
  const d = document.createElement('div'); d.className = 'ripple'; d.style.setProperty('--ripple', color);
  d.style.left = (x / COLS * 100) + '%'; d.style.top = (r / ROWS * 100) + '%';
  board.appendChild(d); setTimeout(() => d.remove(), 1300);
}
function flashDodge(r, x) {
  const e = G.enemies.find(o => o.r === r && Math.abs(o.x - x) < 0.3 && ENEMIES[o.type].dodge);
  const el = e && els.get(e.id); if (!el) return;
  el.classList.remove('s-dodge'); void el.offsetWidth; el.classList.add('s-dodge');
}
function spawnFx(text, r, x, stay) {
  const d = document.createElement('div'); d.className = 'fx' + (stay ? ' stay' : ''); d.textContent = text;
  d.style.left = (x / COLS * 100) + '%'; d.style.top = (r / ROWS * 100) + '%';
  board.appendChild(d); if (!stay) setTimeout(() => d.remove(), 1100);
  return d;
}
function pop(r, c, text) {
  const d = document.createElement('div'); d.className = 'pop'; d.textContent = text;
  d.style.left = ((c + 0.3) / COLS * 100) + '%'; d.style.top = ((r + 0.2) / ROWS * 100) + '%';
  board.appendChild(d); setTimeout(() => d.remove(), 1000);
}
function setMarker(r, type) {
  if (markerEl) { markerEl.remove(); markerEl = null; }
  if (r === null || r === undefined) return;
  const d = document.createElement('div'); d.className = 'mark';
  const special = type && type !== 'wolf' && type !== 'fast';
  if (special) { const boss = !!ENEMIES[type].boss; d.classList.add('special'); if (boss) d.classList.add('boss'); d.innerHTML = `<span>${ENEMIES[type].ico}</span>`; }
  else d.textContent = '🐾';
  d.style.top = (r / ROWS * 100) + '%';
  board.appendChild(d); markerEl = d;
}

// 把引擎這一步發生的事畫出來
function flushEvents() {
  const spawned = [];
  for (const e of G.events) {
    switch (e.t) {
      case 'spawn': spawned.push(e.e.type); if (SPAWN_SFX[e.e.type]) Sound.play(SPAWN_SFX[e.e.type]); break;
      case 'toast': toast(e.msg); break;
      case 'die': Sound.play('die'); break;
      case 'callout': if (!seenEnemy(e.type)) { toast(`${ENEMIES[e.type].ico} ${e.tip}`, true); markSeenEnemy(e.type); } break;
      case 'pop': pop(e.r, e.c, e.text); if (String(e.text)[0] === '+') Sound.play('food'); break;
      case 'unit': renderUnit(e.r, e.c); break;
      case 'fx': fx(e.kind, e.r, e.x, e.id); if (FX_SFX[e.kind]) Sound.play(FX_SFX[e.kind]); break;
      case 'marker': setMarker(e.r, e.type); break;
      case 'sheep': $('#sheep-n').textContent = G.sheep; break;
      case 'hand': buildCards(); if (selected && selected !== 'shovel' && !G.hand.includes(selected)) clearSelection(); break; // 送卡模式：手上的卡變了；選著的那張已經不在就取消
      case 'stray': Sound.play('sheep'); break;
      case 'waveclear': if (e.wave < G.waves.length) { Sound.play('clear'); if (!devUsed) saveCheckpoint(Engine.snapshot(G)); } break; // 最後一波不播，讓天亮的和弦乾淨
      case 'win': onWin(); break;
      case 'lose': onLose(e.reason); break;
    }
  }
  G.events.length = 0;
  for (const t of spawned) markSeenEnemy(t);
}

// ====== 每一幀 ======
function tick(now) {
  raf = requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (paused) return;
  // 加速時分成小步跑，數值行為才跟 1× 一樣
  const wasWave = G.phase === 'wave';
  for (let i = 0; i < speed; i++) { Engine.step(G, dt); flushEvents(); if (G.over) break; }
  if (!wasWave && G.phase === 'wave') Sound.play('wave');
  draw();
}

// 頭上最多兩個圖示，依重要性；緩速與嚎叫不顯示（荊棘腳下看得到、領頭狼本身在場）
function statusText(e) {
  const list = [];
  if (e.enraged) list.push('😡'); if (e.st.panic) list.push('😱'); if (e.st.stun || e.st.distract) list.push('💫'); if (e.st.burn) list.push('🔥'); if (e.st.poison) list.push('☠️');
  return list.slice(0, 2).join('');
}
function draw() {
  const bw = boardSize.w || board.clientWidth, bh = boardSize.h || board.clientHeight; // 尺寸由 ResizeObserver 記著；還沒量到才現讀
  setText($('#food'), G.level.conveyor ? '—' : String(Math.floor(G.food)));
  const t = Math.ceil(G.timer), n = G.waves.length;
  setText($('#wave-info'),
    G.holdWaves ? '照著提示做' :
    G.phase === 'prep' ? (G.started ? `第 1 波 ${t} 秒後來` : '放下第一個單位才開始倒數') :
    G.phase === 'rest' ? (G.wave >= n ? '天快亮了' : `第 ${G.wave + 1} 波 ${t} 秒後來`) :
    `第 ${G.wave} / ${n} 波`);

  const alive = new Set();
  let biting = false;
  for (const e of G.enemies) {
    alive.add(e.id); if (e.biting || e.heldBy) biting = true;
    let el = els.get(e.id);
    if (!el) {
      const def = ENEMIES[e.type];
      el = document.createElement('div'); el.className = 'enemy ' + (def.cls || '');
      el.innerHTML = `<div class="body">${def.ico}<div class="st"></div></div><div class="hp"><i></i></div>`;
      const w = G.waves[G.wave - 1];
      if (w && w.hpMul > 1.2) el.style.setProperty('--hs', (1 + (w.hpMul - 1) * 0.2).toFixed(2));
      board.appendChild(el); els.set(e.id, el);
    }
    el.classList.toggle('s-burn', !!e.st.burn); el.classList.toggle('s-poison', !!e.st.poison); el.classList.toggle('s-stun', !!(e.st.stun || e.st.distract));
    el.classList.toggle('s-crouch', e.crouchT > 0); el.classList.toggle('s-dash', e.dashLeft > 0);
    const rv = e.rv === undefined ? e.r : e.rv; // 換排時從舊排滑到新排
    el.style.transform = `translate(${(e.x * 100).toFixed(2)}%, ${((rv - (e.lift || 0) * 0.6) * 100).toFixed(1)}%)`; // lift：賊翻牆的弧線
    el.classList.toggle('underground', !!e.underground);
    el.classList.toggle('carry', !!e.carrying);
    el.querySelector('.hp > i').style.transform = `scaleX(${(Math.max(0, e.hp) / e.maxHp).toFixed(3)})`;
    const st = el.querySelector('.st'); const txt = statusText(e); if (st.textContent !== txt) st.textContent = txt;
  }
  for (const s of G.shots) {
    alive.add(s.id);
    let el = els.get(s.id);
    if (!el) { el = document.createElement('div'); el.className = 'shot ' + s.kind; board.appendChild(el); els.set(s.id, el); Sound.play('shot'); }
    el.classList.toggle('burn', !!s.burn);
    const lift = s.kind === 'lob' ? Math.sin(Math.min(1, s.t) * Math.PI) * 0.6 : 0;
    el.style.transform = `translate(${(s.x / COLS * bw - 6).toFixed(1)}px, ${((s.r + 0.5 - lift) / ROWS * bh - 6).toFixed(1)}px)`;
  }
  for (const k in G.units) {
    const u = G.units[k]; if (u.type !== 'dog') continue;
    alive.add(u.id);
    let el = els.get(u.id);
    if (!el) { el = document.createElement('div'); el.className = 'dog-run'; el.innerHTML = `<div class="body">🐕</div><div class="hp"><i></i></div>`; board.appendChild(el); els.set(u.id, el); }
    el.style.transform = `translate(${(u.x * 100).toFixed(2)}%, ${u.r * 100}%)`;
    el.classList.toggle('rest', !!u.resting);
    el.querySelector('.hp > i').style.transform = `scaleX(${(Math.max(0, u.hp) / u.maxHp).toFixed(3)})`;
  }
  for (const k in G.units) {
    const u = G.units[k]; if (u.type !== 'patrol') continue;
    alive.add(u.id);
    let el = els.get(u.id);
    if (!el) { el = document.createElement('div'); el.className = 'dog-run patrol-run'; el.innerHTML = `<div class="body">${UNITS.patrol.ico}</div><div class="hp"><i></i></div>`; board.appendChild(el); els.set(u.id, el); }
    el.style.transform = `translate(${u.c * 100}%, ${(u.rv * 100).toFixed(1)}%)`;
    el.querySelector('.hp > i').style.transform = `scaleX(${(Math.max(0, u.hp) / u.maxHp).toFixed(3)})`;
  }
  for (const s of G.strays) {
    alive.add(s.id);
    let el = els.get(s.id);
    if (!el) { el = document.createElement('div'); el.className = 'dog-run stray'; el.innerHTML = `<div class="body">${STRAY.ico}</div>`; board.appendChild(el); els.set(s.id, el); }
    el.style.transform = `translate(${(s.x * 100).toFixed(2)}%, ${s.r * 100}%)`;
  }
  for (const [id, el] of els) if (!alive.has(id)) { el.remove(); els.delete(id); }
  if (biting) Sound.play('bite'); // sound.js 自己限流，每 0.45 秒最多一聲
  // 無月夜：腳印消失的那一波起棋盤變暗（跟引擎 markerVisible 同一個時間點）
  const dark = !!G.level.moonless && G.wave + (G.phase === 'wave' ? 0 : 1) >= G.level.moonless;
  board.classList.toggle('moonless', dark);
  // 油燈照到的排亮起來（跟引擎 rowLit 同一套判定：燈活著、上下 light 排內）
  for (let r = 0; r < ROWS; r++) {
    const lit = dark && Engine.rowLit(G, r);
    if (lit !== litRows[r]) { litRows[r] = lit; fogEls[r].classList.toggle('lit', lit); for (let c = 0; c < COLS; c++) cells[r * COLS + c].classList.toggle('lit', lit); }
  }

  // 吹角手／銀號冷卻條：從放下（或上次吹）開始慢慢填滿，填滿＝蓄力完成、場上有地面敵人就會響
  for (const k in G.units) {
    const u = G.units[k]; const def = UNITS[u.type]; if (!def.push) continue;
    const d = cells[u.r * COLS + u.c].firstElementChild; if (!d) continue;
    const bar = d.querySelector('.cd > i'); if (!bar) continue;
    const ready = u.timer <= 0;
    const len = u.cdLen || def.every; // 剛放下只等 6 秒，條要照 6 秒算，不然一放下就七成滿
    bar.style.transform = `scaleX(${ready ? 1 : Math.max(0, Math.min(1, 1 - u.timer / len)).toFixed(3)})`;
    d.classList.toggle('ready', ready);
  }
  $('#bar > i').style.transform = `scaleX(${G.total ? (G.killed / G.total).toFixed(3) : 0})`;
  const nUnits = Object.keys(G.units).length;
  if (nUnits !== lastUnits) { lastUnits = nUnits; if (selected) markHints(); }
  const f = Math.floor(G.food);
  if (f !== lastFood) { lastFood = f; for (const c of cardEls) c.classList.toggle('poor', !G.level.conveyor && f < UNITS[c.dataset.key].cost); }
  if (tut.on && tut.waiting && f >= TUT_STEPS[tut.step].need) tutShow();
  // 牧人可升級／石牆可修補：糧夠了才掛角標，點一下就知道
  for (const k in G.units) {
    const u = G.units[k], up = Engine.tapHint(G, u); // 規則在引擎，這裡只畫
    const el = cells[u.r * COLS + u.c].firstChild; if (!el) continue;
    let b = el.querySelector('.up');
    if (up && !b) { b = document.createElement('div'); b.className = 'up'; el.appendChild(b); }
    if (b && b.textContent !== up) b.textContent = up;
    if (!up && b) b.remove();
  }
}

// ====== 勝負 ======
function endGame(title, text) {
  $('#result-title').textContent = title;
  $('#result-text').textContent = text;
  $('#psalm').innerHTML = '';
  $('#result').hidden = false;
}
function recordBest(cleared) {
  const k = level.id + ':' + diff;
  const score = cleared ? G.waves.length + 1 : G.wave;
  const old = P.best[k] || {};
  if (!(old.score >= score)) P.best[k] = { score, cleared, wave: G.wave };
  if (cleared) (P.cleared[level.id] = P.cleared[level.id] || {})[diff] = true;
  saveProgress();
}
function onWin() {
  Sound.ambient(false); Sound.play('dawn');
  recordBest(true); clearCheckpoint(level.id);
  const next = Engine.nextOf(level.id);
  endGame('天亮了 🌅', `${DIFFS[diff].name}守過了。${level.outroWin}`);
  $('#next').hidden = !next;
  if (level.psalm) {
    const box = $('#psalm');
    level.psalm.forEach((line, i) => { const d = document.createElement('div'); d.textContent = line; box.appendChild(d); setTimeout(() => d.classList.add('on'), 600 + i * 1500); });
  }
}
function onLose(reason) {
  Sound.ambient(false); Sound.play('lose');
  recordBest(false); clearCheckpoint(level.id);
  const titles = { wolf: '狼闖進羊圈了', bird: '鷙鳥飛進羊圈了', sheep: '羊被偷光了' };
  const text = (level.outroLose && (level.outroLose[reason] || level.outroLose.wolf)) || '';
  endGame(titles[reason] || '守夜失敗', `你撐到了第 ${G.wave} 波。${text}`);
  $('#next').hidden = true;
}

// ====== 開始／重來 ======
function clearBoard() {
  cancelAnimationFrame(raf);
  for (const [, el] of els) el.remove(); els.clear();
  board.querySelectorAll('.pop, .fx, .mark').forEach(x => x.remove()); moundEls.clear(); markerEl = null;
  selected = null;
  document.querySelectorAll('.card').forEach(x => x.classList.remove('selected'));
  tut.on = false; $('#tut-skip').classList.remove('on');
  $('#result').hidden = true;
}
function startGame(fromCp) {
  clearBoard();
  devUsed = devOn;
  if (fromCp) applyDiff(fromCp.diff, false); // 續玩用存檔那一夜的難度，只套用這一局；回開場頁會換回平常的預設
  const fresh = () => { G = Engine.create(level.id, diff); const lo = pickedFor(level); if (lo) Engine.applyPick(G, lo); }; // 只帶點兵選的卡
  fresh();
  let resumed = false, broken = false;
  if (fromCp) {
    try { resumed = Engine.restore(G, fromCp); } catch (e) { resumed = false; }
    if (!resumed) { broken = true; fresh(); } // 還原到一半壞掉就整個重建，不留半套
  }
  // 重新開始「同一關」才丟掉舊檢查點（每關各一份，別關不動）；開著開發者面板這局不會存，舊檔一併清掉免得之後重打
  if (!resumed || devUsed) clearCheckpoint(level.id);
  buildCards();
  cells.forEach(c => { c.innerHTML = ''; c.classList.remove('hint', 'sell', 'swap', 'teach'); c.classList.toggle('rock', G.rocks.has(c.dataset.r + ',' + c.dataset.c)); });
  $('#sheep').hidden = !level.sheep; $('#sheep-n').textContent = G.sheep;
  for (const k in G.units) renderUnit(G.units[k].r, G.units[k].c);
  for (let i = G.events.length - 1; i >= 0; i--) if (G.events[i].t === 'unit') G.events.splice(i, 1); // 單位已直接畫了，其餘事件留給第一幀
  toast(resumed ? `從第 ${G.wave + 1} 波繼續，場上的人都還在${devUsed ? '；開著開發者模式，這局不存檔' : ''}` : broken ? CP_BROKEN : '先點一張卡，再點草地放下去');
  draw();
  if (!resumed && level.id === 1 && (!tutDone() || /[?&]tut/.test(location.search))) tutStart();
  last = performance.now();
  raf = requestAnimationFrame(tick);
  Sound.ambient(true);
}
function backToLevels() {
  clearBoard(); Sound.ambient(false);
  if (G) G.over = true; // 中途回關卡不清檢查點，之後可以「繼續上次」
  paused = false; $('#pause').hidden = true; syncPause();
  buildLevels();
  $('#intro').hidden = true; $('#result').hidden = true; $('#levels').hidden = false;
}


// ====== 點兵與圖鑑 ======
// 一關的卡超過 MAX_CARDS 張就要點兵；帶哪幾張存在這支手機，每關各存一份
const LKEY = 'sheepfold-loadout';
const sessionPick = {};   // 這次開著的頁面裡各關選好的名單；localStorage 寫不進去也照用
const GROUP = { producer: 0, shooter: 1, dog: 1, blocker: 2, floor: 3, instant: 4, support: 4 }; // 卡片固定分組
const sortUnits = keys => [...keys].sort((a, b) => GROUP[UNITS[a].kind] - GROUP[UNITS[b].kind] || keys.indexOf(a) - keys.indexOf(b));
function loadLoadouts() { try { return JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; } catch (e) { return {}; } }

  const s = sessionPick[L.id] || loadLoadouts()[L.id];
  return Engine.validPick(L, s) ? s : Engine.defaultPick(L);
}
// 玩家有沒有為這一關點過兵（存檔失效也算沒點過，開始前會再問一次）

// mode 'pick'＝這一關要點兵；'view'＝從關卡選單看圖鑑（所有已開放的單位）

function renderRoster() {
  const grid = $('#roster-grid'); grid.innerHTML = '';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('selected', b.dataset.tab === roster.tab));
  if (roster.tab === 'units') {

// 白話數字：每個單位一句，數字全部從資料表帶，改數值不用改文案

  { name: '暈眩', ico: '📯', text: `不動也不咬。來源：吹角手（${UNITS.horn.stun} 秒）；雇工逃跑時該排敵人也會愣 3 秒` },
  { name: '嚇退', ico: '🏺', text: `往回跑 ${UNITS.jar.panic} 秒，跑的時候不咬人。來源：瓦瓶火把` },
  { name: '咬住', ico: '🐕', text: '牧羊犬咬住的敵人停下不走，改咬狗，直到狗受傷回窩。狗對賊、偷羊人、狐狸、野狗咬得特別痛' },
  { name: '嚎叫', ico: '🐺', text: `領頭狼每 ${ENEMIES.alpha.howl} 秒一次，2 格內的狼速度 ×${STATUS.howl.mul}，持續 ${STATUS.howl.t} 秒。對策：狗咬住牠` },
  { name: '咆哮', ico: '🦁', text: `獅子每 ${ENEMIES.lion.roar} 秒一次，2 格內的夥伴停手 ${STATUS.fear.t} 秒（牆、荊棘、狗、纏裹的牧人不受影響），雇工直接逃走` },
  { name: '狂暴', ico: '🐻', text: `母熊血量低於 ${Math.round(ENEMIES.bear.enrage * 100)}% 時速度與傷害 ×2，直到被打倒` },
  { name: '厚皮', ico: '🛡', text: `石子與箭矢傷害只剩 ${Math.round(THICK_MUL * 100)}%；機弦、投石機、火、毒全額。母熊、獅子、豹都是厚皮` },
  { name: '換排', ico: '↕️', text: `敵人從這排換到隔壁排，射手要跟著換。來源：牧人杖（趕的）、豺狼碰到牆繞路、豹每 ${ENEMIES.leopard.shiftEvery} 秒自己換、夜鴞在三排之間飄。油燈照到的排，敵人不會自己換排（杖還是趕得動）` },
  { name: '無月夜', ico: '🌑', text: '第二章起第二波後看不到腳印預告，不知道下一隻從哪排來。油燈照到的三排例外' },
  { name: '迷羊', ico: '🐑', text: `不是敵人。從右邊走進來往羊圈走，走到最左邊或抱羊羔的牧人那格就回圈（羊數 +1、糧 +${STRAY.reward}）；地面敵人碰到就叼走，被叼出場算失落一隻；叼羊的被打倒，羊就從那裡繼續走。牧羊犬沒事時會走在牠旁邊護送` },
  { name: '撞牆', ico: '🐗', text: `野豬撞上每道牆的第一下傷害 ${ENEMIES.boar.slam}，之後正常咬；撞完自己暈 ${ENEMIES.boar.slamStun} 秒。踏過荊棘直接踩爛` },
  { name: '蹲伏', ico: '🐆', text: `豹走到第 ${ENEMIES.leopard.crouchAt} 格先蹲 ${ENEMIES.leopard.crouch} 秒（看得到預兆），然後以 ${STATUS.dash.mul} 倍速衝 ${ENEMIES.leopard.dash} 格` },
];
function renderRosterDetail() {
  const box = $('#roster-detail'), k = roster.focus;
  if (!k) { box.innerHTML = roster.mode === 'pick' ? '點一下選或取消，說明會顯示在這裡' : '點一個看說明'; return; }
  if (roster.tab === 'effects') { const g = GLOSSARY[+k]; if (g) box.innerHTML = `<b>${g.ico} ${g.name}</b><br>${g.text}`; return; }
  if (roster.tab === 'units') {
    const u = UNITS[k];
    const fresh = (roster.mode === 'pick' || roster.from === 'intro') && level.fresh.includes(k);
    const away = roster.mode !== 'pick' && roster.from === 'intro' && !level.units.includes(k);
    const learns = roster.from === 'intro' && u.upgrade && u.upgrade.from === Engine.posOf(level.id);
    const note = away ? '<br><span class="new">這一夜還沒遇見，要到後面的夜才會同行</span>' : fresh ? `<br><span class="new">這一夜新開的卡${roster.mode === 'pick' ? '，建議帶上' : ''}</span>` : learns ? `<br><span class="new">這一夜起學會「${u.upgrade.name}」：放下後再點一下</span>` : roster.mode === 'pick' && k === 'shepherd' ? '<br><span class="new">沒有牧人就沒有糧，一定帶</span>' : '';
    box.innerHTML = `<b>${u.ico} ${u.name}</b>　<span class="num">🌾 ${u.cost}</span><br>${u.desc}${note}<br><span class="num">${unitNums(k)}</span><div class="ref">${u.ref}${u.upgrade ? '・升級 ' + u.upgrade.ref : ''}</div>`;
  } else {
    const e = ENEMIES[k];
    box.innerHTML = `<b>${e.ico} ${e.name}</b><br>${e.tip || '最普通的一隻，走到最左邊就闖進羊圈'}<br><span class="num">${enemyNums(k)}</span>`;
  }
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { roster.tab = b.dataset.tab; roster.focus = null; renderRoster(); }));
$('#roster-go').addEventListener('click', () => { if (roster.picked.size < MIN_CARDS) return; saveLoadout(level.id, sortUnits([...roster.picked])); $('#roster').hidden = true; const cp = pendingCp; pendingCp = null; startGame(cp); });
$('#roster-back').addEventListener('click', () => { $('#roster').hidden = true; if (roster.from === 'intro') { showIntroNew(level); $('#intro').hidden = false; } else if (roster.from === 'pause') $('#pause').hidden = false; else $('#levels').hidden = false; });
$('#intro-roster').addEventListener('click', () => openRoster(pickedFor(level) ? 'pick' : 'view', 'intro'));
$('#levels-codex').addEventListener('click', () => openRoster('view', 'levels'));

// ====== 第 1 關手把手（只教一次；網址加 ?tut 可重看） ======
const TKEY = 'sheepfold-tutorial-done';
const TUT_STEPS = [
  { card: 'shepherd', cell: [2, 0], say: '先點「牧人」卡，再點亮著的格子。牧人會產糧' },
  { card: 'slinger',  cell: [2, 1], need: 100, wait: '牧人會送糧來，等糧到 100', say: '點「投石手」，放在牧人右邊。他朝這一排丟石頭' },
  { card: 'wall',     cell: [2, 4], need: 50,  wait: '再等一下，糧到 50',       say: '點「石牆」，放在前面擋路。狼會先咬牆' },
];
const tut = { on: false, step: 0, waiting: false };
function tutDone() { try { return localStorage.getItem(TKEY) === '1'; } catch (e) { return false; } }
function tutStart() { tut.on = true; tut.step = 0; G.holdWaves = true; $('#tut-skip').classList.add('on'); tutShow(); }
function tutShow() {
  const st = TUT_STEPS[tut.step], ready = !st.need || G.food >= st.need;
  tut.waiting = !ready;
  document.querySelectorAll('#cards .card').forEach(c => c.classList.toggle('dim', !ready || c.dataset.key !== st.card));
  cells.forEach(c => c.classList.toggle('teach', ready && +c.dataset.r === st.cell[0] && +c.dataset.c === st.cell[1]));
  toast(ready ? st.say : st.wait, true);
}
function tutAdvance() {
  tut.step++;
  if (tut.step >= TUT_STEPS.length) return tutEnd('做得好。狼要來了，腳印出現在哪一排，狼就從那排來');
  tutShow();
}
function tutEnd(msg) {
  tut.on = false; if (G) G.holdWaves = false;
  document.querySelectorAll('#cards .card').forEach(c => c.classList.remove('dim'));
  cells.forEach(c => c.classList.remove('teach'));
  $('#tut-skip').classList.remove('on');
  try { localStorage.setItem(TKEY, '1'); } catch (e) {}
  if (msg) toast(msg, true);
}
$('#tut-skip').addEventListener('click', () => tutEnd('好，自己來。狼要來了'));

// ====== 暫停與檢查點 ======
// 暫停：上方 ⏸ 或切到背景；畫面蓋一層，按繼續才走
// 暫停狀態同步到畫面：棋盤循環動畫停、開發者面板的暫停鍵字樣跟著變
function syncPause() { board.classList.toggle('paused', paused); $('#dev-pause').classList.toggle('on', paused); $('#dev-pause').textContent = paused ? '繼續' : '暫停'; }
function pauseGame() {
  if (!G || G.over || paused) return;
  if (!$('#result').hidden || !$('#roster').hidden || !$('#intro').hidden || !$('#levels').hidden) return;
  paused = true; $('#pause').hidden = false; syncPause(); syncSoundUI();
}
function resumeGame() {
  paused = false; $('#pause').hidden = true; syncPause();
  last = performance.now();
}
$('#pause-btn').addEventListener('click', pauseGame);
$('#resume-btn').addEventListener('click', resumeGame);
$('#pause-codex').addEventListener('click', () => openRoster('view', 'pause')); // 暫停中查圖鑑，看完回暫停
$('#pause-back').addEventListener('click', () => { resumeGame(); backToLevels(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pauseGame(); Sound.suspend(); } else Sound.resume(); });

// ====== 聲音設定 ======
// 頂欄與開場頁的喇叭：一下切全部靜音；暫停層裡才有細項（音效／蟲鳴／音量三檔）
function syncSoundUI() {
  const p = Sound.prefs;
  document.querySelectorAll('.snd-btn').forEach(b => { b.textContent = p.sfx ? '🔊' : '🔇'; b.title = p.sfx ? '聲音：開（點一下靜音）' : '聲音：關（點一下打開）'; });
  document.querySelectorAll('#snd-panel [data-snd]').forEach(b => { const on = !!p[b.dataset.snd]; b.textContent = on ? '開' : '關'; b.classList.toggle('on', on); });
  document.querySelectorAll('#snd-panel [data-vol]').forEach(b => b.classList.toggle('on', Number(b.dataset.vol) === p.vol));
  document.querySelectorAll('#snd-panel .snd-row').forEach((row, i) => row.classList.toggle('off', i > 0 && !p.sfx));
}
document.querySelectorAll('.snd-btn').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); Sound.set('sfx', !Sound.prefs.sfx); syncSoundUI(); Sound.play('tap'); }));
document.querySelectorAll('#snd-panel [data-snd]').forEach(b => b.addEventListener('click', () => { Sound.set(b.dataset.snd, !Sound.prefs[b.dataset.snd]); syncSoundUI(); Sound.play('tap'); }));
document.querySelectorAll('#snd-panel [data-vol]').forEach(b => b.addEventListener('click', () => { Sound.set('vol', Number(b.dataset.vol)); syncSoundUI(); Sound.play('clear'); }));
// iOS 要有一次手勢才能出聲：第一次點任何地方就把聲音打開
document.addEventListener('pointerdown', () => Sound.unlock(), { capture: true, passive: true });
syncSoundUI();

// 檢查點：每清完一波存一次，每關各存一份（去玩別關不會蓋掉）；守完、輸了、重新開始同一關只清自己這關的
const CKEY = id => `sheepfold-checkpoint-${id}`;
function loadCheckpoint(id) { try { const c = JSON.parse(localStorage.getItem(CKEY(id)) || 'null'); return c && typeof c === 'object' ? c : null; } catch (e) { return null; } }
function saveCheckpoint(snap) { try { localStorage.setItem(CKEY(snap.levelId), JSON.stringify(snap)); } catch (e) {} }
function clearCheckpoint(id) { try { localStorage.removeItem(CKEY(id)); } catch (e) {} }
// 舊版只有一份存檔：搬到那一關自己的欄位，不讓玩家的進度不見
try { const old = JSON.parse(localStorage.getItem('sheepfold-checkpoint') || 'null'); if (old && old.levelId && !localStorage.getItem(CKEY(old.levelId))) localStorage.setItem(CKEY(old.levelId), JSON.stringify(old)); localStorage.removeItem('sheepfold-checkpoint'); } catch (e) {}
// 續玩前要點兵：存檔裡場上的單位一定勾著，其餘照預設補滿，卡列和棋盤才對得上
function prepickFromCp(cp) {
  const s = new Set(['shepherd']);
  for (const u of cp.units) if (level.units.includes(u.type)) s.add(u.type);
  for (const k of pickedFor(level)) if (s.size < MAX_CARDS) s.add(k);
  roster.picked = s; renderRoster();
}
$('#resume-cp').addEventListener('click', () => {
  const cp = loadCheckpoint(level.id);
  if (!Engine.checkSnapshot(cp, level.id)) { openIntro(level); return; } // 壞檔交給開場頁：清掉並說明，文案只有一份
  if (pickedFor(level) && !hasLoadout(level)) { openRoster('pick', 'intro'); pendingCp = cp; prepickFromCp(cp); return; } // 跟「開始守夜」一樣先點兵
  $('#intro').hidden = true; startGame(cp); // 難度在 startGame 裡才套用，點兵頁退出不會留下來
});

// ====== 開發者面板 ======
function setDev(on) {
  devOn = on; $('#dev').classList.toggle('on', on); if (on) devUsed = true;
  if (on) toast('開發者模式開了：可加速、加糧、任意格放敵人');
}
function buildDevEnemies() {
  const sel = $('#dev-enemy');
  for (const k in ENEMIES) { const o = document.createElement('option'); o.value = k; o.textContent = ENEMIES[k].ico + ' ' + ENEMIES[k].name; sel.appendChild(o); }
  const so = document.createElement('option'); so.value = 'stray'; so.textContent = STRAY.ico + ' ' + STRAY.name + '（中立）'; sel.appendChild(so);
  sel.addEventListener('change', () => { devEnemy = sel.value; if (devEnemy) { selected = null; document.querySelectorAll('.card').forEach(x => x.classList.remove('selected')); cells.forEach(x => x.classList.remove('hint')); toast(`點任一格，放一隻${devEnemy === 'stray' ? STRAY.name : ENEMIES[devEnemy].name}`); } });
}
document.querySelectorAll('#dev [data-speed]').forEach(b => b.addEventListener('click', () => { speed = Number(b.dataset.speed); document.querySelectorAll('#dev [data-speed]').forEach(x => x.classList.toggle('on', x === b)); }));
$('#dev-pause').addEventListener('click', () => { paused = !paused; syncPause(); if (!paused) last = performance.now(); });
$('#dev-food').addEventListener('click', () => { if (G) { Engine.dev.food(G, 500); draw(); } });
$('#dev-all').addEventListener('click', () => { if (G) { Engine.dev.allCards(G); buildCards(); toast('這一局全部的卡都能用'); } });
$('#dev-next').addEventListener('click', () => { if (G) { Engine.dev.nextWave(G); flushEvents(); draw(); } });
$('#dev-clear').addEventListener('click', () => { if (G) { Engine.dev.clear(G); flushEvents(); draw(); } });
$('#top span:first-child').addEventListener('click', () => { foodTaps++; if (foodTaps >= 5) { foodTaps = 0; setDev(!devOn); } });
buildDevEnemies(); setDev(devOn);

buildBoard(); buildLevels();
try { diff = localStorage.getItem('sheepfold-diff') || 'calm'; } catch (e) {}
if (!DIFFS[diff]) diff = 'calm';
document.querySelectorAll('.diff').forEach(b => b.addEventListener('click', () => applyDiff(b.dataset.key)));
$('#start').addEventListener('click', () => { if (pickedFor(level) && !hasLoadout(level)) { openRoster('pick', 'intro'); return; } $('#intro').hidden = true; startGame(); });
$('#intro-back').addEventListener('click', backToLevels);
$('#retry').addEventListener('click', () => startGame());
$('#back').addEventListener('click', backToLevels);
$('#next').addEventListener('click', () => { const nx = Engine.nextOf(level.id); clearBoard(); if (nx) openIntro(nx); else backToLevels(); });
</script>
</body>
